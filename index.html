}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {

/* Top Header */

.folder-card {

/* FIXED Responsive Video Player */
.video-shell {
  width: 100%; border-radius: 16px; overflow: hidden; background: var(--navy-950);
  border: 1.2px solid rgba(99,102,241,0.35);
}

.video-controls {

  padding: 8px 12px; background: var(--navy-950); color: #CBD5E1; font-size: 12px; font-weight: 700;

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field label { font-size: 12px; font-weight: 700; color: var(--text-sec); }
.input {
  width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--border); background: #fff; color: var(--text); font-size: 13.5px;
}
.input:focus { outline: none; border-color: var(--neon-violet); box-shadow: 0 0 0 3px rgba(124,58,237,0.12); }

/* Footer */
.portal-footer {
  background: var(--grad-header); color: #fff; border-radius: 22px; padding: 20px;
  border: 1.4px solid rgba(99,102,241,0.5);
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  background: rgba(255,255,255,0.96); backdrop-filter: blur(12px);

.nav-item {

}

/* Modals */
.modal-backdrop {

/* FULL-FEATURED CBT & QUIZ PLAYER (100% Parity with Android & Original Player) */
.cbt-overlay {
  position: fixed; inset: 0; z-index: 55;
  background:

}

}
.cbt-back-circle {

.cbt-lang-toggle {

.cbt-lang-btn {

}
.cbt-lang-btn.active { background: var(--grad-gold); color: var(--navy-950); }
.cbt-timer-pill {

.cbt-timer-pill.danger { background: var(--rose-600); border-color: #FDA4AF; }
.cbt-workspace {
  flex: 1; overflow-y: auto;
  max-width: 1240px; width: 100%; margin: 0 auto;
  padding: 16px; display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start;

  .cbt-workspace { grid-template-columns: minmax(0, 1fr) 315px; }
}
.cbt-q-area { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cbt-palette-sidebar {
  background: #fff; border: 1.4px solid var(--border); border-radius: 18px;
  padding: 14px; box-shadow: 0 6px 22px rgba(79,70,229,0.08);
}
@media (min-width: 860px) {
  .cbt-palette-sidebar { position: sticky; top: 14px; }
  .mobile-palette-toggle { display: none !important; }
  .palette-collapsible { display: block !important; }
}
.mobile-palette-toggle {
  width: 100%; display: flex; align-items: center; justify-content: space-between;

  color: var(--navy-950); font-weight: 800; font-size: 13.5px;

.palette-legend {

.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.palette-grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-bottom: 14px;

.pal-pill {
  height: 40px; border-radius: 10px; font-weight: 800; font-size: 13px;

.pal-pill.not-answered { background: var(--rose-100); color: var(--rose-600); border-color: #FDA4AF; }
.pal-pill.wrong { background: var(--rose-600); color: #fff; border-color: var(--rose-600); }
.pal-pill.marked { background: var(--neon-violet); color: #fff; border-color: var(--neon-violet); }
.pal-pill.current { outline: 2.5px solid var(--neon-cyan-light); outline-offset: 1px; box-shadow: 0 0 12px rgba(34,211,238,0.45); }

/* Question Type Blocks */
.q-img-frame {
  background: #fff; border: 1.2px solid var(--border); border-radius: 12px;
  padding: 8px; margin-top: 10px; text-align: center;
}

}

.passage-box {

  border-radius: 16px; padding: 14px;
}
.statement-box {
  background: #fff; border: 1.4px solid rgba(6,182,212,0.55);
  border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 8px;
}
.statement-list {
  background: var(--canvas); border-radius: 10px; padding: 11px 13px;
  white-space: pre-line; font-size: 14.5px; line-height: 1.65;
}
.ar-box {
  background: #fff; border: 1.4px solid rgba(124,58,237,0.55);
  border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 9px;
}
.ar-row-a { background: var(--royal-50); border: 1px solid var(--royal-100); border-radius: 11px; padding: 11px 13px; }

/* ================= DETERMINISTIC 10-WAY SHARD HASH (IDENTICAL TO KOTLIN) ================= */
function computeMeritShardIndex(uid) {
  let hash = 0;
  for (let i = 0; i < uid.length; i++) {
    hash = ((hash * 31) + uid.charCodeAt(i)) & 0x7FFFFFFF;
  }
  return hash % MERIT_SHARD_COUNT;
}

/* ================= MEDIA URL & VIDEO PLAYER HELPERS ================= */
function extractDriveId(url) {
  const s = String(url || "").trim();
  if (!s || (!s.includes("drive.google.com") && !s.includes("docs.google.com"))) return null;
  for (const re of [/\/file\/d\/([a-zA-Z0-9_-]{10,})/, /\/d\/([a-zA-Z0-9_-]{10,})/, /[?&]id=([a-zA-Z0-9_-]{10,})/]) {
    const m = s.match(re); if (m) return m[1];
  }
  return null;
}
function toDirectImageUrl(url) {
  const s = String(url || "").trim();
  if (!s) return "";
  const id = extractDriveId(s);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1200` : s;
}
function extractYouTubeId(url) {
  const s = String(url || "").trim();
  for (const re of [/youtu\.be\/([a-zA-Z0-9_-]{6,})/, /youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/, /youtube\.com\/live\/([a-zA-Z0-9_-]{6,})/, /youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{6,})/, /[?&]v=([a-zA-Z0-9_-]{6,})/]) {
    const m = s.match(re); if (m) return m[1];
  }
  return null;
}
function isVerticalVideo(url, format = "AUTO") {
  if (format === "VERTICAL") return true;
  if (format === "LANDSCAPE") return false;
  const low = String(url || "").toLowerCase();
  return low.includes("youtube.com/shorts/") || low.includes("instagram.com/reel") || low.includes("instagram.com/p/");
}
function isDirectVideoFile(url) { return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(String(url || "").trim()); }
function toEmbedVideoUrl(url) {
  const s = String(url || "").trim();
  const dId = extractDriveId(s);
  if (dId) return `https://drive.google.com/file/d/${dId}/preview`;
  const ytId = extractYouTubeId(s);
  if (ytId) return `https://www.youtube.com/embed/${ytId}?controls=1&fs=1&playsinline=1&rel=0&modestbranding=1&autoplay=1`;
  const ig = s.match(/instagram\.com\/(?:reel|reels|p)\/([a-zA-Z0-9_-]+)/i);
  if (ig) return `https://www.instagram.com/p/${ig[1]}/embed/`;
  return s;
}
function normalizeUrl(u) {
  const s = String(u || "").trim();
  if (!s) return "";
  return /^https?:\/\//i.test(s) ? s : `https://${s}`;
}

function sanitizeRaw(str) {
  return String(str || "")
    .replace(/^\uFEFF/, "").trim()
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/,\s*([}\]])/g, "$1");
}
function parseAnsIdx(raw, maxOpts) {
  let idx = 0;
  if (typeof raw === "number") idx = Math.floor(raw);
  else {
    const up = String(raw || "0").trim().toUpperCase();
    const map = { A: 0, "OPTION A": 0, "(A)": 0, B: 1, "OPTION B": 1, "(B)": 1, C: 2, "OPTION C": 2, "(C)": 2, D: 3, "OPTION D": 3, "(D)": 3, E: 4 };
    idx = up in map ? map[up] : (parseInt(up, 10) || 0);
  }
  return Math.max(0, Math.min(idx, Math.max(0, maxOpts - 1)));
}
function parseLocalized(obj, key, enAlt, hiAlt) {
  const v = obj?.[key];
  if (typeof v === "string" && v.trim()) return { en: v, hi: v };
  if (Array.isArray(v)) { const j = v.join("\n"); if (j.trim()) return { en: j, hi: j }; }
  if (v && typeof v === "object") {
    const en = Array.isArray(v.en || v.english) ? (v.en || v.english).join("\n") : String(v.en || v.english || "");
    const hi = Array.isArray(v.hi || v.hindi) ? (v.hi || v.hindi).join("\n") : String(v.hi || v.hindi || "");
    if (en.trim() || hi.trim()) return { en, hi };
  }
  const e = String(obj?.[enAlt] || ""), h = String(obj?.[hiAlt] || "");
  return (e.trim() || h.trim()) ? { en: e, hi: h } : null;
}
function parseTestInput(rawText) {
  const cleaned = sanitizeRaw(rawText);
  if (!cleaned) return { ok: false, error: "Input is empty. Choose a .json/.csv/.txt file or paste JSON." };

        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }

        correctIndex: parseAnsIdx(cols[5], 4),
        explanation: { en: cols[7] || "No explanation provided.", hi: cols[7] || "स्पष्टीकरण उपलब्ध नहीं है।" }
      });
    }
    if (!qs.length) return { ok: false, error: "No valid CSV rows parsed (need 6+ columns)." };
    return { ok: true, paper: { title: "Imported CSV Mock Test", durationMinutes: 30, marksCorrect: 2, marksNegative: 0.66, questions: qs }, warnings: [`Imported ${qs.length} questions from CSV.`] };
  }
  try {
    const parsed = JSON.parse(cleaned);
    const root = Array.isArray(parsed) ? null : parsed;
    let arr = Array.isArray(parsed) ? parsed : (parsed.questions || parsed.qList || parsed.items || parsed.mcqs || parsed.data?.questions || parsed.test?.questions);
    if (!Array.isArray(arr) || !arr.length) return { ok: false, error: "No questions array found (expected 'questions', 'qList', 'items', or [...])." };
    const warnings = [];
    if (arr.length > 500) { warnings.push(`Trimmed to 500 questions (from ${arr.length}).`); arr = arr.slice(0, 500); }
    const questions = arr.map((q, idx) => {
      let optsEn = [], optsHi = [], optImgs = [];
      const ro = q.options || q.choices || q.answers;
      if (Array.isArray(ro)) {
        ro.forEach(o => {
          if (o && typeof o === "object") {
            optsEn.push(String(o.en || o.english || o.text || ""));
            optsHi.push(String(o.hi || o.hindi || o.text || ""));
            optImgs.push(o.image || o.img || "");
          } else { optsEn.push(String(o ?? "")); optsHi.push(String(o ?? "")); }
        });
      } else if (ro && typeof ro === "object") {
        optsEn = (ro.en || ro.english || []).map(x => (x == null ? "" : String(x)));
        optsHi = (ro.hi || ro.hindi || []).map(x => (x == null ? "" : String(x)));
      }
      if (!optsEn.length && !optsHi.length) {
        [["option_a","optionA","a","A"],["option_b","optionB","b","B"],["option_c","optionC","c","C"],["option_d","optionD","d","D"]].forEach(vs => {
          const hit = vs.find(k => q[k]); if (hit) { optsEn.push(String(q[hit])); optsHi.push(String(q[hit])); }
        });
      }
      if (Array.isArray(q.optionImages)) optImgs = q.optionImages.map(x => (x == null ? "" : String(x)));
      const hasAnyOptText = optsEn.some(x => x.trim()) || optsHi.some(x => x.trim());
      const hasAnyOptImg = optImgs.some(x => x.trim());
      if (!hasAnyOptText && !hasAnyOptImg) { optsEn = ["Option A","Option B","Option C","Option D"]; optsHi = ["विकल्प A","विकल्प B","विकल्प C","विकल्प D"]; }

      const parseGrid = (g) => {
        if (!g || typeof g !== "object") return null;
        const headers = Array.isArray(g.headers) ? g.headers.map(x => String(x ?? "")) : [];
        const rows = Array.isArray(g.rows) ? g.rows.map(r => Array.isArray(r) ? r.map(c => String(c ?? "")) : []) : [];
        return (headers.length || rows.length) ? { headers, rows } : null;
      };
      let tableData = null;
      if (q.tableData && typeof q.tableData === "object") {
        const tObj = q.tableData.tableObj || q.tableData;
        const enGrid = parseGrid(tObj.en || tObj.english || (Array.isArray(tObj.headers) || Array.isArray(tObj.rows) ? tObj : null));
        const hiGrid = parseGrid(tObj.hi || tObj.hindi);
        const intro = parseLocalized(q.tableData, "intro");
        if (enGrid || hiGrid || intro) tableData = { intro, en: enGrid, hi: hiGrid };
      }

      const stData = q.statementData ? {
        intro: parseLocalized(q.statementData, "intro"),
        list: parseLocalized(q.statementData, "list"),
        conclusion: parseLocalized(q.statementData, "conclusion")
      } : null;
      const assertionLoc = parseLocalized(q, "assertion");
      const reasonLoc = parseLocalized(q, "reason");
      const directionLoc = parseLocalized(q, "direction");
      const passageLoc = parseLocalized(q, "passage");
      const hasRichHeader = Boolean(stData || tableData || assertionLoc || reasonLoc || passageLoc || (q.image || q.img));

      const rawQ = parseLocalized(q, "question", "question_en", "question_hi") || parseLocalized(q, "text");
      const resolvedQuestion = rawQ || (hasRichHeader ? { en: "", hi: "" } : { en: `Question ${idx+1}`, hi: `प्रश्न ${idx+1}` });

      const rawAns = q.correctAnswer ?? q.correct ?? q.ans ?? q.correctIndex ?? q.answer ?? 0;
      const slotCount = Math.max(optsEn.length, optsHi.length, optImgs.length, 4);
      return {
        id: q.id || (idx + 1), type: q.type || "standard",
        subjectTag: q.subjectTag || q.subject || "General", pyqTag: q.pyqTag || "CGPSC",
        imageUrl: (q.image || q.img || "") ? String(q.image || q.img) : "",
        optionImages: optImgs,
        passage: passageLoc,
        passageImage: (q.passageImage || q.passage?.image || "") ? String(q.passageImage || q.passage?.image) : "",
        statementData: stData,
        tableData,
        assertion: assertionLoc, reason: reasonLoc, direction: directionLoc,
        question: resolvedQuestion,
        optionsEn: optsEn, optionsHi: optsHi,
        correctIndex: parseAnsIdx(rawAns, slotCount),
        explanation: parseLocalized(q, "explanation", "explanation_en", "explanation_hi") || { en: "", hi: "" },
        explanationImage: (q.explanationImage || "") ? String(q.explanationImage) : ""
      };
    });
    return {
      ok: true, warnings,
      paper: {
        title: root?.title || root?.testName || root?.name || "Custom Mock Test",
        durationMinutes: Number(root?.durationMinutes || root?.duration || 30) || 30,
        marksCorrect: Number(root?.positiveMarks ?? root?.marksCorrect ?? 2) || 2,
        marksNegative: Number(root?.negativeMarks ?? root?.marksNegative ?? 0.66) || 0,
        questions
      }
    };
  } catch (e) {
    return { ok: false, error: `JSON Parse Error: ${e.message}` };
  }
}

/* ================= GITHUB ZERO-READ CDN + WRITE API ================= */
function cdnUrls(owner, repo, branch, path) {
  const clean = path.replace(/^\/+/, "");
  return [
    `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${clean}`,
    `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${clean}`
  ];
}
async function fetchCdnJson(owner, repo, branch, path) {
  for (const url of cdnUrls(owner, repo, branch, path)) {
    try {
      const r = await fetch(url, { cache: "no-cache" });
      if (r.ok) return await r.json();
    } catch {}
  }
  return null;
}
async function uploadToGitHub(path, contentString, message) {
  const { owner, repo, branch, token } = state.github;
  if (!owner || !repo || !token) throw new Error("Configure GitHub Owner, Repo & PAT in Admin Studio first.");
  const clean = path.replace(/^\/+/, "");
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${clean}`;
  let sha = undefined;
  const check = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch || "main")}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" }
  });
  if (check.ok) { const j = await check.json(); sha = j.sha; }
  const b64 = btoa(unescape(encodeURIComponent(contentString)));
  const res = await fetch(apiUrl, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: b64, branch: branch || "main", ...(sha ? { sha } : {}) })
  });
  if (!res.ok) throw new Error(`GitHub upload HTTP ${res.status}`);
  return cdnUrls(owner, repo, branch || "main", clean)[0];
}

async function loadPortalData(force = false) {
  const cached = loadLocal("cgpsc_portal_cache", null);
  const fresh = !force && cached && (Date.now() - cached.ts < CACHE_TTL_MS);
  if (fresh && cached.config && cached.catalog) {
    state.config = cached.config; state.catalog = cached.catalog;
    state.cdnActive = Boolean(cached.config.githubCdnOwner || state.github.owner);
    state.quotaLabel = state.cdnActive ? "0-Read CDN Cache (10m)" : "Local Cache (0 Reads)";
    render(); return;
  }
  const owner = state.github.owner || cached?.config?.githubCdnOwner || "";
  const repo = state.github.repo || cached?.config?.githubCdnRepo || "";
  const branch = state.github.branch || cached?.config?.githubCdnBranch || "main";
  if (owner && repo) {
    const [cfg, cat] = await Promise.all([
      fetchCdnJson(owner, repo, branch, "data/dashboard_config.json"),
      fetchCdnJson(owner, repo, branch, "data/test_catalog.json")
    ]);
    if (cfg || cat) {
      if (cfg) state.config = { ...DEFAULT_CONFIG, ...cfg };
      if (cat) state.catalog = { ...DEFAULT_CATALOG, ...cat };
      state.cdnActive = true; state.quotaLabel = "GitHub jsDelivr CDN (0 Reads)";
      saveLocal("cgpsc_portal_cache", { ts: Date.now(), config: state.config, catalog: state.catalog });
      render(); return;
    }
  }
  if (state.user) {
    try {
      const [cfgSnap, catSnap] = await Promise.all([
        getDoc(doc(db, "portalData", "dashboardConfig")),
        getDoc(doc(db, "portalData", "testCatalog"))
      ]);
      if (cfgSnap.exists()) state.config = { ...DEFAULT_CONFIG, ...cfgSnap.data() };
      if (catSnap.exists()) {
        const d = catSnap.data();
        const toArr = (v) => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
        state.catalog = {
          scheduled: toArr(d.scheduled),
          practice: toArr(d.practice),
          practiceFolders: toArr(d.practiceFolders)
        };
      }
      state.quotaLabel = "Firestore Fallback (Cached 10m)";
      saveLocal("cgpsc_portal_cache", { ts: Date.now(), config: state.config, catalog: state.catalog });
    } catch (e) { console.warn("Firestore portal fallback:", e.message); }
  }
  render();
}

async function handleGoogleSignIn(forceRedirect = false) {
  if (authInFlight) return;

  // Guard 1: Browser blocks Google OAuth on local content:// or file:// pages
  if (location.protocol !== "http:" && location.protocol !== "https:") {
    setAuthHelpMessage(
      `<b>Cannot sign in from a local file (${esc(location.protocol)}).</b><br>` +
      `Please open your hosted website URL (for example <b>https://crackcgpsc.github.io/...</b>) in Chrome and try again.`
    );
    toast("Open via https:// website link to sign in.");
    return;
  }

  authInFlight = true;
  const btn = document.getElementById("modGSignIn");
  if (btn) { btn.disabled = true; btn.textContent = "Signing in..."; }

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  try {
    if (forceRedirect) {
      await signInWithRedirect(auth, provider);
      return;
    }
    await signInWithPopup(auth, provider);
    closeModal();
    toast("Signed in with Google!");
  } catch (e) {
    const code = e?.code || "";
    if (code === "auth/popup-blocked" || code === "auth/cancelled-popup-request" || code === "auth/operation-not-supported-in-this-environment") {
      try {
        setAuthHelpMessage("Opening full-page Google Sign-In for your browser...", false);
        await signInWithRedirect(auth, provider);
        return;
      } catch (re) {
        setAuthHelpMessage(`<b>Sign-in could not start:</b> ${esc(re.message || code)}`);
      }
    } else if (code === "auth/unauthorized-domain") {
      const host = location.hostname || "this domain";
      setAuthHelpMessage(
        `<b>Domain not authorized yet:</b> <code>${esc(host)}</code><br>` +
        `Add <b>${esc(host)}</b> in Firebase Console → Authentication → Settings → <b>Authorized domains</b>, then refresh.`
      );
    } else if (code === "auth/popup-closed-by-user") {
      setAuthHelpMessage("Sign-in window was closed. Tap again or use Full-Page Sign-In below.", false);
    } else {
      setAuthHelpMessage(`<b>Sign-in error:</b> ${esc(e.message || code)}`);
    }
  } finally {
    authInFlight = false;
    if (btn) { btn.disabled = false; btn.textContent = "Sign in with Google"; }
  }
}

/* ================= FORMATTERS ================= */
function fmtHms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const pad = n => String(n).padStart(2, "0");
  return d > 0 ? `${d}d ${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(h)}:${pad(m)}:${pad(sec)}`;
}
function fmtDate(ms) {
  if (!ms) return "TBA";
  return new Date(ms).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function folderTrail(folderId) {
  const byId = Object.fromEntries((state.catalog.practiceFolders || []).map(f => [f.id, f]));
  const res = []; let cur = byId[folderId]; let g = 0;
  while (cur && g++ < 12) { res.unshift(cur); cur = cur.parentId ? byId[cur.parentId] : null; }
  return res;
}
function countFolderTests(fid) {
  const flds = state.catalog.practiceFolders || [];
  const tsts = state.catalog.practice || [];
  let c = tsts.filter(t => t.folderId === fid).length;
  flds.filter(f => f.parentId === fid).forEach(ch => { c += countFolderTests(ch.id); });
  return c;
}

}

function renderScheduledHub() {
  const now = Date.now();
  const cats = ["ALL","DAILY","WEEKLY","MONTHLY"];
  const list = (state.catalog.scheduled || [])
    .filter(s => state.schedFilter === "ALL" || (s.scheduleCategory||"").toUpperCase() === state.schedFilter)
    .sort((a,b) => (a.windowStartMs||0) - (b.windowStartMs||0));
  return `<div class="card">
    <div class="section-head"><div><div class="section-title">🏆 Scheduled Live Exam Series</div><div class="section-sub">Single-attempt merit tests • All-State Rank PDF</div></div></div>
    <div class="pill-row" style="margin-bottom:12px;">
      ${cats.map(c => `<button class="chip ${state.schedFilter===c?"active":""}" data-sched-cat="${c}">${c[0]+c.slice(1).toLowerCase()}</button>`).join("")}
    </div>
    ${list.length ? list.map(ex => {
      const isLive = now >= ex.windowStartMs && now <= ex.windowEndMs;
      const isUp = now < ex.windowStartMs;
      return `<div class="sched-item ${isLive?"is-live":""}" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <div><span class="pill ${isLive?"pill-emerald":isUp?"pill-gold":"pill-royal"}">${isLive?"LIVE NOW":isUp?"UPCOMING":"ENDED"}</span> <span class="pill pill-royal">${esc(ex.scheduleCategory||"DAILY")}</span></div>
          <span class="mono" style="font-size:11.5px;font-weight:700;">Code: ${esc(ex.testCode)}</span>
        </div>
        <div style="font-weight:800;font-size:15px;">${esc(ex.title)}</div>
        <div style="font-size:12px;color:var(--muted);">${ex.questionCount} Qs • ${ex.durationMinutes}m • +${ex.marksCorrect}/-${ex.marksNegative} • ${fmtDate(ex.windowStartMs)} → ${fmtDate(ex.windowEndMs)}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
          <span class="mono" style="font-size:12px;color:${isLive?"var(--emerald-600)":"var(--gold-600)"};" data-cd-target="${isLive?ex.windowEndMs:ex.windowStartMs}" data-cd-mode="${isLive?"live":isUp?"up":"end"}">${isLive?"Ends in "+fmtHms(ex.windowEndMs-now):isUp?"Opens in "+fmtHms(ex.windowStartMs-now):"Merit PDF in Results"}</span>

  </div>`;
}

  return `<div class="card">
    <div class="section-head">

      ${trail.map(c => `<span>›</span><button style="font-weight:700;color:var(--royal-600);" data-open-folder="${esc(c.id)}" data-fscope="${scopeKey}">${esc(c.name)}</button>`).join("")}

        <div class="practice-actions">
          <button class="btn btn-navy btn-sm" data-play-practice="${esc(t.testId)}" data-mode="TEST">⏱ Test Mode</button>
          <button class="btn btn-quiz btn-sm" data-play-practice="${esc(t.testId)}" data-mode="QUIZ">⚡ Quiz Mode</button>

function renderResults() {
  const all = [...state.cloudAttempts, ...state.localAttempts].sort((a,b) => (b.submittedMs||0)-(a.submittedMs||0));
  const avgAcc = all.length ? Math.round(all.reduce((s,a) => s + (a.accuracyPercent||0), 0) / all.length) : 0;
  const best = all.length ? Math.max(...all.map(a => Number(a.totalScore||0))).toFixed(1) : "0.0";
  return `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
      <div class="card" style="background:var(--royal-50);"><div style="font-size:11.5px;font-weight:700;color:var(--royal-600);">Completed</div><div style="font-size:22px;font-weight:800;">${all.length}</div></div>
      <div class="card" style="background:var(--emerald-50);"><div style="font-size:11.5px;font-weight:700;color:var(--emerald-600);">Avg Accuracy</div><div style="font-size:22px;font-weight:800;">${avgAcc}%</div></div>
      <div class="card" style="background:var(--gold-50);"><div style="font-size:11.5px;font-weight:700;color:var(--gold-600);">Best Score</div><div style="font-size:22px;font-weight:800;">${best}</div></div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-bottom:8px;">My Attempt History</div>
      ${all.length ? all.map(a => `
        <div style="border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;"><span class="pill ${a.syncedToCloud?"pill-emerald":"pill-royal"}">${a.syncedToCloud?"CLOUD MERIT SYNCED":"LOCAL PRACTICE"}</span><small style="color:var(--muted);">${fmtDate(a.submittedMs)}</small></div>
          <div style="font-weight:800;margin-top:6px;">${esc(a.testTitle)}</div>
          <div style="font-size:13px;font-weight:700;color:var(--navy-900);margin-top:4px;">Score: ${Number(a.totalScore||0).toFixed(2)} / ${a.maxScore} • Acc: ${a.accuracyPercent}%</div>
          <div style="font-size:12px;color:var(--muted);">✓ ${a.correctCount} Correct • ✕ ${a.wrongCount} Wrong • ○ ${a.unattemptedCount} Skipped</div>
        </div>`).join("") : `<div style="color:var(--muted);font-size:13px;">Complete any Practice or Scheduled exam to track your score history here.</div>`}
    </div>`;
}

}

/* ================= CBT ENGINE ================= */
async function launchPractice(summary, mode) {
  let raw = "";
  if (summary.storageProvider === "BUILTIN" || summary.testId === "demo_cgpsc_starter") raw = SAMPLE_JSON;
  else if (summary.jsonUrl) { const r = await fetch(summary.jsonUrl); raw = await r.text(); }
  else {
    const snap = await getDoc(doc(db, "practiceTests", summary.testId));
    raw = snap.exists() ? JSON.stringify(snap.data()) : "";
  }
  const parsed = parseTestInput(raw);
  if (!parsed.ok) return toast(parsed.error);
  startCbt(summary.testId, false, mode, parsed.paper);
}

async function launchScheduled(summary) {
  if (!state.user) return openSignInModal();
  if (!state.profile) return openProfileModal();
  const now = Date.now();
  if (now < summary.windowStartMs || now > summary.windowEndMs) return toast("Exam window is not currently open.");
  let raw = "";
  if (summary.jsonUrl) { const r = await fetch(summary.jsonUrl); raw = await r.text(); }
  else { const snap = await getDoc(doc(db, "scheduledTests", summary.testId)); raw = snap.exists() ? JSON.stringify(snap.data()) : ""; }
  const parsed = parseTestInput(raw);
  if (!parsed.ok) return toast(parsed.error);
  startCbt(summary.testId, true, "TEST", parsed.paper);
}

/* ================= CBT & QUIZ PLAYER ENGINE (ALL QUESTION TYPES + PALETTE + MATHJAX + SCORECARD) ================= */
function resolveLoc(loc, lang) {
  if (!loc) return "";
  if (typeof loc === "string") return loc.trim();
  const e = String(loc.en || "").trim(), h = String(loc.hi || "").trim();
  return lang === "HI" ? (h || e) : (e || h);
}
function resolveLocTable(td, lang) {
  if (!td) return null;
  const e = td.en && (td.en.headers?.length || td.en.rows?.length) ? td.en : null;
  const h = td.hi && (td.hi.headers?.length || td.hi.rows?.length) ? td.hi : null;
  if (lang === "HI") {
    const hiMatchesEn = !e || (h && (h.rows?.length || 0) >= (e.rows?.length || 0));
    return (h && hiMatchesEn) ? h : (e || h);
  }
  return e || h;
}
function resolveOpts(q, lang) {
  const en = q.optionsEn || [], hi = q.optionsHi || [], imgs = q.optionImages || [];
  const hasEn = en.some(x => String(x || "").trim());
  const hasHi = hi.some(x => String(x || "").trim());
  const hasImg = imgs.some(x => String(x || "").trim());
  const n = Math.max(hasEn ? en.length : 0, hasHi ? hi.length : 0, hasImg ? imgs.length : 0, 4);
  return Array.from({ length: n }, (_, i) => {
    const e = String(en[i] || ""), h = String(hi[i] || "");
    return lang === "HI" ? (hasHi ? (h.trim() ? h : e) : e) : (hasEn ? (e.trim() ? e : h) : h);
  });
}
function formatExamRichText(raw) {
  let s = esc(raw || "");
  s = s.replace(/\n/g, "<br>");
  // Offline readable TeX fallback if MathJax CDN has not finished loading
  if (!window.MathJax?.typesetPromise) {
    s = s.replace(/\\d?frac\{([^{}]+)\}\{([^{}]+)\}/g, "$1/$2")
         .replace(/\\sqrt\{([^{}]+)\}/g, "√($1)")
         .replace(/\\times/g, "×").replace(/\\div/g, "÷").replace(/\\pm/g, "±")
         .replace(/\\\(|\\\)/g, "");
  }
  return s;
}
function safeImgSrc(src) {
  const s = String(src || "").trim();
  if (!s) return "";
  if (/^data:image\//i.test(s)) return s;
  return toDirectImageUrl(s);
}

// Tab-Switch Proctoring Listener
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state.activeExam && !state.activeExam.submitted) {
    state.activeExam.warnings = (state.activeExam.warnings || 0) + 1;
    const wEl = document.getElementById("cbtWarnBadge");
    if (wEl) {
      wEl.textContent = `⚠ ${state.activeExam.warnings} Tab Switch`;
      wEl.classList.remove("hidden");
    }
    toast(`Proctor Warning #${state.activeExam.warnings}: Do not switch tabs during an active test!`);
  }
});

function startCbt(testId, isScheduled, mode, paper) {
  state.activeExam = {
    testId, isScheduled, mode, paper, idx: 0, lang: "EN",
    remSec: (paper.durationMinutes || 30) * 60,
    responses: paper.questions.map((_, i) => ({ sel: null, marked: false, visited: i === 0 })),
    submitted: false, result: null, warnings: 0, paletteOpenMobile: false
  };
  clearInterval(state.examTimer);
  state.examTimer = setInterval(() => {
    if (!state.activeExam || state.activeExam.submitted) return clearInterval(state.examTimer);
    state.activeExam.remSec--;
    const tEl = document.getElementById("cbtTimerEl");
    if (tEl) {
      tEl.textContent = fmtHms(state.activeExam.remSec * 1000);
      tEl.classList.toggle("danger", state.activeExam.remSec <= 120);
    }
    if (state.activeExam.remSec <= 0) submitCbt();
  }, 1000);
  renderCbt();
}

function jumpCbt(newIdx) {
  const ex = state.activeExam;
  if (!ex || newIdx < 0 || newIdx >= ex.paper.questions.length) return;
  ex.idx = newIdx;
  ex.responses[newIdx].visited = true;
  renderCbt();
}

async function submitCbt() {
  const ex = state.activeExam; if (!ex || ex.submitted) return;
  clearInterval(state.examTimer);
  let correct = 0, wrong = 0, unatt = 0;
  ex.paper.questions.forEach((q, i) => {
    const s = ex.responses[i].sel;
    if (s === null) unatt++; else if (s === q.correctIndex) correct++; else wrong++;
  });
  const totalScore = Math.max(0, (correct * ex.paper.marksCorrect) - (wrong * ex.paper.marksNegative));
  const maxScore = ex.paper.questions.length * ex.paper.marksCorrect;
  const accuracyPercent = (correct + wrong) > 0 ? Math.round((correct * 100) / (correct + wrong)) : 0;
  const selectedOptions = ex.responses.map(r => (r.sel === null ? -1 : r.sel));
  const timeTakenSeconds = Math.max(0, ((ex.paper.durationMinutes || 30) * 60) - (ex.remSec || 0));
  const appSwitchWarnings = ex.warnings || 0;
  const attempt = {
    userId: state.user?.uid || "local", testId: ex.testId, testTitle: ex.paper.title, mode: ex.mode,
    rollNumber: state.profile?.rollNumber || "LOCAL", studentName: state.profile?.studentName || "Aspirant",
    correctCount: correct, wrongCount: wrong, unattemptedCount: unatt, totalScore, maxScore, accuracyPercent,
    timeTakenSeconds, appSwitchWarnings, selectedOptions,
    submittedMs: Date.now(), syncedToCloud: false
  };
  ex.submitted = true; ex.result = attempt;
  state.localAttempts = [attempt, ...state.localAttempts].slice(0, 60);
  saveLocal("cgpsc_local_attempts", state.localAttempts);
  state.retention.testsCompleted = (state.retention.testsCompleted || 0) + 1;
  saveLocal("cgpsc_retention", state.retention);

  if (ex.isScheduled && state.user) {
    try {
      const shardIdx = computeMeritShardIndex(state.user.uid);
      await updateDoc(doc(db, "testMeritSheets", `${ex.testId}_shard_${shardIdx}`), {
        [`entries.${state.user.uid}`]: {
          uid: state.user.uid, studentName: attempt.studentName, rollNumber: attempt.rollNumber,
          totalScore, maxScore, correctCount: correct, wrongCount: wrong, unattemptedCount: unatt,
          accuracyPercent, timeTakenSeconds, appSwitchWarnings, submittedAt: serverTimestamp()
        },
        updatedAt: serverTimestamp()
      });
      await setDoc(doc(db, "users", state.user.uid, "attempts", ex.testId), {
        userId: state.user.uid, testId: ex.testId, testTitle: ex.paper.title, mode: ex.mode,
        rollNumber: attempt.rollNumber, studentName: attempt.studentName,
        correctCount: correct, wrongCount: wrong, unattemptedCount: unatt,
        totalScore, maxScore, accuracyPercent, timeTakenSeconds, appSwitchWarnings,
        selectedOptions, submittedAt: serverTimestamp()
      });
      attempt.syncedToCloud = true;
      toast(`Submitted & synced to Merit Shard #${shardIdx}!`);
    } catch (e) { toast("Saved locally; cloud merit sync note: " + e.message); }
  } else {
    toast("Score Card Ready! (Saved locally — 0 Firebase writes)");
  }
  renderCbt(); render(); openScoreCardModal();
}

/* ================= MODALS ================= */
function openModal(html) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-box">${html}</div>`;
  root.classList.remove("hidden");
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}
function closeModal() { document.getElementById("modalRoot").classList.add("hidden"); }

function openAccountFlow() {
  if (!state.user) return openSignInModal();
  if (!state.profile) return openProfileModal();
  openModal(`
    <h3 style="margin-bottom:10px;">Candidate Admit Card</h3>
    <div style="background:var(--navy-950);color:#fff;padding:14px;border-radius:14px;margin-bottom:12px;">
      <div class="mono" style="font-size:11px;color:var(--gold-300);">OFFICIAL ROLL NUMBER</div>
      <div class="mono" style="font-size:20px;font-weight:800;">${esc(state.profile.rollNumber)}</div>
      <div style="font-weight:700;margin-top:6px;">${esc(state.profile.studentName)}</div>
      <div style="font-size:12px;color:#94A3B8;">${esc(state.profile.email)}</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline btn-sm" id="modEditProf">Edit</button>
      <button class="btn btn-rose btn-sm" id="modSignOut">Sign Out</button>
      <button class="btn btn-navy btn-sm" id="modClose">Close</button>
    </div>`);
  document.getElementById("modEditProf").onclick = openProfileModal;
  document.getElementById("modSignOut").onclick = async () => { await signOut(auth); closeModal(); toast("Signed out."); };
  document.getElementById("modClose").onclick = closeModal;
}

function openSignInModal() {
  const isLocalFile = location.protocol !== "http:" && location.protocol !== "https:";
  openModal(`
    <h3 style="margin-bottom:8px;color:var(--navy-950);">Sign in with Google</h3>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:12px;">Get your Official Roll Number, join Scheduled Live Exams, and track your All-State Merit Rank Lists.</p>
    <div id="authHelpBox" class="${isLocalFile ? "" : "hidden"}" style="padding:10px 12px;border-radius:12px;border:1.2px solid #FDA4AF;background:var(--rose-50);color:var(--rose-600);font-size:12.5px;line-height:1.45;margin-bottom:12px;">
      ${isLocalFile ? `<b>Local file detected (${esc(location.protocol)}).</b><br>Google Sign-In requires an <b>https://</b> website URL (such as <b>https://crackcgpsc.github.io/...</b>). Please open your hosted site link in Chrome to sign in.` : ""}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" id="modCancel">Later</button>
      <button class="btn btn-navy" id="modGSignIn">Sign in with Google</button>
    </div>
    ${!isLocalFile ? `<div style="margin-top:10px;text-align:right;">
      <button id="modGRedirect" style="font-size:12px;font-weight:700;color:var(--neon-violet);text-decoration:underline;">Having popup issues on mobile? Use Full-Page Sign-In</button>
    </div>` : ""}`);
  document.getElementById("modCancel").onclick = closeModal;
  document.getElementById("modGSignIn").onclick = () => handleGoogleSignIn(false);
  document.getElementById("modGRedirect")?.addEventListener("click", () => handleGoogleSignIn(true));
}

function openProfileModal() {
  const p = state.profile || {};
  openModal(`
    <h3 style="margin-bottom:10px;">Generate Official Roll Number</h3>
    <div class="field"><label>Full Name</label><input class="input" id="prName" value="${esc(p.studentName || state.user?.displayName || "")}"></div>
    <div class="field"><label>Date of Birth (YYYY-MM-DD)</label><input class="input" id="prDob" value="${esc(p.dateOfBirth || "")}" placeholder="2000-08-15"></div>
    <div class="field"><label>Mobile Number</label><input class="input" id="prMob" value="${esc(p.mobileNumber || "")}"></div>
    <div class="field"><label>Email</label><input class="input" id="prEmail" value="${esc(p.email || state.user?.email || "")}"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline btn-sm" id="prCancel">Cancel</button>
      <button class="btn btn-emerald" id="prSave">Save Admit Card</button>
    </div>`);
  document.getElementById("prCancel").onclick = closeModal;
  document.getElementById("prSave").onclick = async () => {
    const rollNumber = p.rollNumber || ("CGPSC26" + Math.floor(100000 + Math.random()*900000));
    const fields = {
      studentName: document.getElementById("prName").value.trim(),
      dateOfBirth: document.getElementById("prDob").value.trim() || "2000-01-01",
      mobileNumber: document.getElementById("prMob").value.trim(),
      email: document.getElementById("prEmail").value.trim()
    };
    if (state.profile) {
      await updateDoc(doc(db, "users", state.user.uid), { ...fields, updatedAt: serverTimestamp() });
      state.profile = { ...state.profile, ...fields };
    } else {
      const created = { uid: state.user.uid, ...fields, rollNumber, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
      await setDoc(doc(db, "users", state.user.uid), created);
      state.profile = { uid: state.user.uid, ...fields, rollNumber };
    }
    closeModal(); render(); toast("Admit Card Ready: " + rollNumber);
  };
}

function openLocalJsonModal() {
  openModal(`
    <h3 style="margin-bottom:8px;">Run Local JSON / CSV Test</h3>
    <input type="file" id="locFile" accept=".json,.txt,.csv,application/json,text/plain,*/*" style="margin-bottom:8px;">
    <button class="btn btn-outline btn-sm" id="locDemo" style="margin-bottom:8px;">Load Demo</button>
    <textarea class="input mono" id="locRaw" rows="5" placeholder="Paste JSON or CSV..."></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
      <button class="btn btn-outline btn-sm" id="locQuiz">Quiz Mode</button>
      <button class="btn btn-emerald btn-sm" id="locTest">Start CBT</button>
    </div>`);
  document.getElementById("locFile").onchange = (e) => { const f = e.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = () => { document.getElementById("locRaw").value = r.result; }; r.readAsText(f); };
  document.getElementById("locDemo").onclick = () => { document.getElementById("locRaw").value = SAMPLE_JSON; };
  const go = (m) => { const res = parseTestInput(document.getElementById("locRaw").value); if (!res.ok) return toast(res.error); closeModal(); startCbt("local_" + Date.now(), false, m, res.paper); };
  document.getElementById("locQuiz").onclick = () => go("QUIZ");
  document.getElementById("locTest").onclick = () => go("TEST");
}

function openQuickQuestionModal(targetTa, onUpdate) {
  openModal(`
    <h3 style="margin-bottom:8px;">Visual Quick-Add Question</h3>
    <div class="field"><label>Question (English)</label><input class="input" id="qqEn"></div>
    <div class="field"><label>Question (Hindi - optional)</label><input class="input" id="qqHi"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <input class="input" id="qqA" placeholder="Option A"><input class="input" id="qqB" placeholder="Option B">
      <input class="input" id="qqC" placeholder="Option C"><input class="input" id="qqD" placeholder="Option D">
    </div>
    <div class="field" style="margin-top:8px;"><label>Correct Option</label><select class="input" id="qqAns"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>
    <div class="field"><label>Explanation</label><input class="input" id="qqExp" placeholder="Verified explanation"></div>
    <button class="btn btn-emerald btn-full" id="qqAddBtn">Append Question to JSON</button>`);
  document.getElementById("qqAddBtn").onclick = () => {
    const existing = parseTestInput(targetTa.value);
    const qs = existing.ok ? existing.paper.questions : [];
    const qEn = document.getElementById("qqEn").value.trim(), qHi = document.getElementById("qqHi").value.trim();
    const opts = [document.getElementById("qqA").value, document.getElementById("qqB").value, document.getElementById("qqC").value, document.getElementById("qqD").value];
    qs.push({ id: qs.length+1, subjectTag: "General", pyqTag: "CGPSC", question: { en: qEn||qHi, hi: qHi||qEn }, options: { en: opts, hi: opts }, correctAnswer: parseInt(document.getElementById("qqAns").value, 10), explanation: { en: document.getElementById("qqExp").value || "Verified answer.", hi: document.getElementById("qqExp").value || "सत्यापित उत्तर।" } });
    targetTa.value = JSON.stringify({ title: existing.ok ? existing.paper.title : "Custom Mock Test", durationMinutes: 30, positiveMarks: 2, negativeMarks: 0.66, questions: qs }, null, 2);
    closeModal(); onUpdate(); toast("Question appended!");
  };
}

async function openAdminMeritModal(testId, title) {
  toast("Merging 10 Merit Shards...");
  const all = [];
  for (let i = 0; i < MERIT_SHARD_COUNT; i++) {
    try {
      const snap = await getDoc(doc(db, "testMeritSheets", `${testId}_shard_${i}`));
      if (snap.exists()) {
        const entries = snap.data().entries || {};
        Object.entries(entries).forEach(([uid, v]) => all.push({ uid, ...v }));
      }
    } catch {}
  }
  all.sort((a,b) => (b.totalScore - a.totalScore) || (b.accuracyPercent - a.accuracyPercent));
  openModal(`
    <h3 style="margin-bottom:6px;">Merit Rank List • ${esc(title)}</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Merged from 10 Shards • ${all.length} Ranked Candidates</div>
    ${all.length ? all.map((e, idx) => `<div style="display:flex;justify-content:space-between;padding:8px 10px;background:${idx<3?"var(--gold-50)":"var(--subtle)"};border-radius:8px;margin-bottom:6px;">
      <span><b>#${idx+1}</b> ${esc(e.studentName)} <small>(${esc(e.rollNumber)})</small></span>
      <span class="mono" style="font-weight:800;color:var(--emerald-600);">${Number(e.totalScore||0).toFixed(2)}</span>
    </div>`).join("") : `<div style="color:var(--muted);">No submissions yet.</div>`}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
      <button class="btn btn-navy btn-sm" onclick="window.print()">🖨 Print Merit PDF</button>
      <button class="btn btn-outline btn-sm" id="mrClose">Close</button>
    </div>`);
  document.getElementById("mrClose").onclick = closeModal;
}

/* ================= LIVE 1-SECOND COUNTDOWN TICKER ================= */
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll("[data-cd-target]").forEach(el => {
    const target = Number(el.dataset.cdTarget || 0);
    const mode = el.dataset.cdMode;
    if (mode === "live") el.textContent = (el.classList.contains("countdown-digits") ? "" : "Ends in ") + fmtHms(target - now);
    else if (mode === "up") el.textContent = (el.classList.contains("countdown-digits") ? "" : "Opens in ") + fmtHms(target - now);
  });
}, 1000);

loadPortalData(false);
