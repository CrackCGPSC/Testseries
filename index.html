<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crack CGPSC Free Test Series — Official Portal & CBT Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        typeset: false,
        pageReady: () => window.MathJax.startup.defaultPageReady().then(() => {
          if (typeof window.__onMathJaxReady === "function") window.__onMathJaxReady();
        })
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    :root {
      --navy-950: #0b2854;
      --navy-900: #1e3a8a;
      --navy-800: #1e40af;
      --royal-600: #2563eb;
      --royal-100: #dbeafe;
      --royal-50: #eff6ff;
      --amber-600: #d97706;
      --amber-500: #f59e0b;
      --amber-300: #fcd34d;
      --amber-100: #fef3c7;
      --emerald-600: #059669;
      --emerald-500: #10b981;
      --emerald-50: #ecfdf5;
      --rose-600: #e11d48;
      --rose-50: #fff1f2;
      --purple-600: #7c3aed;
      --purple-50: #f5f3ff;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      line-height: 1.5;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    button { font-family: inherit; cursor: pointer; transition: all .15s ease; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    input, textarea, select {
      font-family: inherit;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      width: 100%;
      background: #fff;
      color: var(--slate-900);
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--royal-600);
      border-color: var(--royal-600);
    }

    /* Header (Matches Android PortalTopHeaderBar: single clean row, no tab clutter) */
    .topbar {
      background: var(--navy-900);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .16);
    }
    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    /* Borderless Drive Logo: zero background box, zero border */
    .brand-logo-img {
      height: 36px;
      width: auto;
      max-width: 84px;
      object-fit: contain;
      background: transparent;
      border: none;
      display: block;
      flex-shrink: 0;
    }
    .brand-fallback-ico {
      width: 32px;
      height: 32px;
      color: var(--amber-300);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-text-col { min-width: 0; }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--amber-300);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-pill {
      background: var(--navy-800);
      color: #fff;
      border: 1px solid #3b82f6;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* Android-style App Shell (Bottom Nav on mobile, Left Nav Rail on tablet/desktop) */
    .app-shell {
      display: flex;
      min-height: calc(100vh - 58px);
      max-width: 1240px;
      margin: 0 auto;
    }
    .shell-rail {
      display: none;
      width: 92px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--slate-200);
      padding: 16px 8px;
      flex-direction: column;
      gap: 8px;
    }
    .shell-bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 45;
      background: #fff;
      border-top: 1px solid var(--slate-200);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 12px rgba(15, 23, 42, .06);
    }
    @media (min-width: 769px) {
      .shell-rail { display: flex; }
      .shell-bottom-nav { display: none; }
    }
    body.in-player .shell-rail,
    body.in-player .shell-bottom-nav { display: none !important; }

    .nav-item-btn {
      background: transparent;
      border: none;
      color: var(--slate-500);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      min-width: 64px;
    }
    .nav-item-btn .nav-pill-ico {
      width: 48px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease;
    }
    .nav-item-btn.active {
      color: var(--navy-900);
    }
    .nav-item-btn.active .nav-pill-ico {
      background: var(--royal-100);
      color: var(--navy-900);
    }

    .container {
      flex: 1;
      min-width: 0;
      padding: 16px 14px 88px;
    }
    @media (min-width: 769px) {
      .container { padding: 20px 22px 44px; }
    }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .cms-grid { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
    @media (min-width: 320px) {
      .cms-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cms-full { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      .cms-grid > :not(.cms-full) { padding: 11px; border-radius: 13px; }
      .cms-grid > :not(.cms-full) h3 { font-size: 13.5px !important; }
      .cms-grid > :not(.cms-full) p { font-size: 12px !important; }
    }

    .card {
      background: #fff;
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .03);
    }
    .hero-card {
      background: linear-gradient(135deg, var(--navy-950), var(--navy-900), var(--royal-600));
      color: #fff;
      border-radius: 18px;
      padding: 18px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-amber { background: var(--amber-100); color: #92400e; }
    .badge-green { background: var(--emerald-50); color: var(--emerald-600); border: 1px solid #a7f3d0; }
    .badge-blue { background: var(--royal-100); color: var(--navy-900); }
    .badge-rose { background: var(--rose-50); color: var(--rose-600); border: 1px solid #fecdd3; }
    .badge-purple { background: var(--purple-50); color: var(--purple-600); border: 1px solid #ddd6fe; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--royal-600); color: #fff; }
    .btn-navy { background: var(--navy-900); color: #fff; }
    .btn-emerald { background: var(--emerald-600); color: #fff; }
    .btn-purple { background: var(--purple-600); color: #fff; }
    .btn-rose { background: var(--rose-600); color: #fff; }
    .btn-outline { background: #fff; color: var(--slate-900); border: 1px solid var(--slate-200); }

    /* Compact Stylish Social Media Footer with Official Brand Icons */
    .footer-card {
      background: var(--navy-950);
      color: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 6px;
    }
    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .social-chip {
      background: #132d63;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(147, 197, 253, .32);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .social-chip:hover {
      background: #1e40af;
      transform: translateY(-1px);
    }
    .social-ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .app-dl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(147, 197, 253, .18);
    }
    .app-dl-chip {
      background: linear-gradient(135deg, #132d63, #1e3a8a);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(147, 197, 253, .38);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform .15s ease, border-color .15s ease;
    }
    .app-dl-chip:hover { transform: translateY(-1px); border-color: #60a5fa; }

    /* Sponsor / Ad Card */
    .sponsor-card {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 1px solid #fcd34d;
      border-radius: 16px;
      padding: 14px 16px;
    }

    /* Mobile-First & Desktop-Docked CBT Player */
    .player-shell {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .player-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (min-width: 900px) {
      .player-layout {
        grid-template-columns: minmax(0, 1fr) 320px;
      }
      .desktop-hide { display: none !important; }
    }
    @media (max-width: 899px) {
      .palette-drawer.is-collapsed { display: none !important; }
    }
    .player-topbar {
      background: linear-gradient(135deg, var(--navy-950), var(--navy-900));
      color: #fff;
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .16);
    }
    .player-back-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .24);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .player-back-circle:hover { background: rgba(255, 255, 255, .22); }
    .player-title-wrap { min-width: 0; flex: 1; }
    .player-title-txt {
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-sub-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      flex-wrap: wrap;
    }
    .player-timer-chip {
      background: rgba(15, 23, 42, .72);
      border: 1px solid rgba(252, 211, 77, .38);
      color: var(--amber-300);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .lang-switch {
      display: inline-flex;
      background: rgba(15, 23, 42, .75);
      border: 1px solid rgba(147, 197, 253, .38);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }
    .lang-opt {
      border: none;
      background: transparent;
      color: #cbd5e1;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 800;
      min-height: 28px;
      transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .lang-opt.active {
      background: var(--royal-600);
      color: #fff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, .45);
    }

    /* Complex Question Sub-blocks */
    .q-passage-box {
      background: var(--slate-100);
      border-left: 4px solid var(--royal-600);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--slate-900);
      line-height: 1.65;
    }
    .q-statement-box {
      background: var(--royal-50);
      border: 1px solid var(--royal-100);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14.5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .q-dir-box {
      background: var(--amber-100);
      border-left: 4px solid var(--amber-600);
      color: #78350f;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .q-ar-box {
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      overflow: hidden;
      background: var(--slate-50);
    }
    .q-ar-row { padding: 10px 14px; font-size: 14px; }
    .q-ar-row + .q-ar-row { border-top: 1px solid var(--slate-200); }
    .q-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--slate-200);
      border-radius: 12px;
    }
    .q-table th { background: var(--navy-900); color: #fff; font-size: 13px; padding: 9px 12px; }
    .q-table td { font-size: 13.5px; padding: 9px 12px; border-bottom: 1px solid var(--slate-200); background: #fff; }
    .q-opt-img {
      max-height: 135px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      margin-top: 4px;
      background: #fff;
    }
    .q-exp-box {
      background: var(--royal-50);
      border: 1px solid var(--royal-100);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--navy-900);
      font-size: 13.5px;
      line-height: 1.65;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--slate-200);
      border-radius: 12px;
      padding: 11px 13px;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 14px;
      color: var(--slate-900);
    }
    .option-btn.selected { border-color: var(--royal-600); background: var(--royal-50); font-weight: 600; }
    .option-btn.correct { border-color: var(--emerald-600); background: var(--emerald-50); font-weight: 700; color: #065f46; }
    .option-btn.wrong { border-color: var(--rose-600); background: var(--rose-50); font-weight: 700; color: #9f1239; }
    .opt-circle {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--slate-100); color: var(--slate-700);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 12px; flex-shrink: 0;
    }
    .option-btn.selected .opt-circle { background: var(--royal-600); color: #fff; }
    .option-btn.correct .opt-circle { background: var(--emerald-600); color: #fff; }
    .option-btn.wrong .opt-circle { background: var(--rose-600); color: #fff; }

    .player-actions-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--slate-200);
    }
    @media (min-width: 620px) {
      .player-actions-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
      }
      .player-actions-bar .btn-next-main { margin-left: auto; }
    }
    .palette-toggle-btn {
      width: 100%;
      background: var(--royal-50);
      color: var(--navy-900);
      border: 1.5px solid var(--royal-100);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .palette-drawer {
      background: #fff;
      border: 1.5px solid var(--royal-100);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, .06);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .palette-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--slate-700);
    }
    .leg-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; vertical-align: middle; }
    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    @media (min-width: 600px) {
      .palette-grid { grid-template-columns: repeat(8, 1fr); }
    }
    .q-pill {
      height: 40px; border-radius: 10px; font-weight: 800; font-size: 13px;
      border: 1px solid var(--slate-200); background: var(--slate-100); color: var(--slate-700);
    }
    .q-pill.answered { background: var(--emerald-500); color: #fff; border-color: var(--emerald-600); }
    .q-pill.not-answered { background: #f43f5e; color: #fff; border-color: var(--rose-600); }
    .q-pill.marked { background: var(--purple-600); color: #fff; border-color: #6d28d9; }
    .q-pill.current { outline: 3px solid var(--royal-600); }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .62);
      z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #fff; border-radius: 18px; width: 100%; max-width: 620px;
      max-height: 90vh; overflow-y: auto; padding: 22px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, .25);
    }
    .modal-wide { max-width: 920px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--navy-900); color: #fff; padding: 10px; text-align: left; }
    td { border-bottom: 1px solid var(--slate-200); padding: 9px 10px; }
    .podium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
    .podium-card { background: var(--royal-50); border: 1px solid var(--royal-100); border-radius: 12px; padding: 12px; text-align: center; }

    .hidden { display: none !important; }
    .alert-bar {
      background: var(--amber-100); color: #78350f; padding: 10px 14px;
      border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
    }
    .q-meta-strip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .q-meta-subj {
      color: var(--royal-600);
      text-transform: uppercase;
      font-weight: 800;
    }
    .q-meta-pyq { color: var(--slate-500); font-weight: 700; }

    /* Scheduled Horizontal Slider Tabs & Cards + Merit Table */
    .sched-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .sched-tabs::-webkit-scrollbar { display: none; }
    .sched-tab-pill {
      border: 1px solid var(--slate-200);
      background: #fff;
      color: var(--slate-700);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sched-tab-pill.active {
      background: var(--navy-900);
      color: #fff;
      border-color: var(--navy-900);
    }
    .sched-slider {

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(String(str));
      let bin = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        bin += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(bin);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error("No file selected."));
        if (file.size > 5 * 1024 * 1024) {
          return reject(new Error("Image size must be 5 MB or smaller."));
        }
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const idx = result.indexOf(",");
          resolve(idx >= 0 ? result.slice(idx + 1) : result);
        };
        reader.onerror = () => reject(new Error("Failed to read file."));
        reader.readAsDataURL(file);
      });
    }

    async function ghParseError(resp) {
      let msg = "";
      try {
        const j = await resp.json();
        msg = j.message || "";
      } catch (_) {}
      if (resp.status === 401) return "GitHub Token invalid or expired (401). Please check your Fine-Grained Token.";
      if (resp.status === 403) return `GitHub permission denied (403): ${msg || "Ensure Contents: Read & Write is enabled."}`;
      if (resp.status === 404) return `GitHub repo, branch, or file not found (404): ${msg}`;
      return `GitHub API error (${resp.status}): ${msg || resp.statusText}`;
    }

    async function ghVerifyRepo(cfg) {

          "Authorization": `Bearer ${cfg.token}`,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
        }
      });
      if (!resp.ok) throw new Error(await ghParseError(resp));
      const data = await resp.json();

      return `Connected to ${data.full_name} (${cfg.branch})`;

          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"

      if (resp.status === 404) return null;
      if (!resp.ok) throw new Error(await ghParseError(resp));

        branch: cfg.branch
      };
      if (sha) body.sha = sha;
      const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cleanPath}`;
      const resp = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${cfg.token}`,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });
      if (!resp.ok) throw new Error(await ghParseError(resp));
      const rawUrl = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${cleanPath}`;
      return { githubPath: cleanPath, rawUrl };
    }

    async function ghDeleteFile(cfg, path, commitMessage) {
      if (!ghIsConfigured(cfg) || !path) return;
      const cleanPath = path.replace(/^\/+/, "");
      const sha = await ghFetchSha(cfg, cleanPath);
      if (!sha) return;
      const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cleanPath}`;
      const resp = await fetch(url, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${cfg.token}`,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: commitMessage, sha, branch: cfg.branch })
      });
      if (!resp.ok && resp.status !== 404) throw new Error(await ghParseError(resp));
    }

    function ghExtractPath(rawUrl, cfg) {
      if (!ghIsConfigured(cfg) || !rawUrl) return null;
      const prefix = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/`;
      const clean = String(rawUrl).split("?")[0].trim();
      if (clean.toLowerCase().startsWith(prefix.toLowerCase())) {
        return clean.slice(prefix.length).replace(/^\/+/, "");
      }
      return null;
    }

    // --- Helpers & MathJax / Question Formatting ---
    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function offlineTexFallback(s) {
      return String(s || "")
        .replace(/\\\[|\\\]|\\\(|\\\)|\$\$/g, "")
        .replace(/\\d?frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1/$2)")
        .replace(/\\sqrt\[([^\]]+)\]\{([^{}]+)\}/g, "$1√($2)")
        .replace(/\\sqrt\{([^{}]+)\}/g, "√($1)")
        .replace(/\\(?:text|mathbf|textbf|mathrm|mathit)\{([^{}]+)\}/g, "$1")
        .replace(/\\times/g, "×").replace(/\\div/g, "÷").replace(/\\pm/g, "±")
        .replace(/\\leq?/g, "≤").replace(/\\geq?/g, "≥").replace(/\\neq/g, "≠")
        .replace(/\\implies/g, "⟹").replace(/\\iff/g, "⟺")
        .replace(/\\alpha/g, "α").replace(/\\beta/g, "β").replace(/\\gamma/g, "γ")
        .replace(/\\theta/g, "θ").replace(/\\pi/g, "π").replace(/\\sigma/g, "σ")
        .replace(/\\Delta/g, "Δ").replace(/\\sum/g, "∑").replace(/\\infty/g, "∞")
        .replace(/\\circ/g, "°").replace(/\\ /g, " ");
    }

    function formatRichHtml(raw) {
      const s = String(raw ?? "");
      if (!s.trim()) return "";
      const hasMathJax = Boolean(window.MathJax && typeof window.MathJax.typesetPromise === "function");
      const processed = hasMathJax ? s : offlineTexFallback(s);
      // Escape HTML while safely restoring simple inline tags (<b>, <i>, <u>, <sup>, <sub>, <br>)
      let safe = processed.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      safe = safe.replace(/&lt;(\/?(?:b|strong|i|em|u|sup|sub))&gt;/gi, "<$1>");
      safe = safe.replace(/&lt;br\s*\/?&gt;/gi, "<br/>");
      return safe.replace(/\t/g, "&nbsp;&nbsp;").replace(/\n/g, "<br/>");
    }

    function typesetMath(targetEl) {
      if (!targetEl) return;
      if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
        window.MathJax.typesetClear && window.MathJax.typesetClear([targetEl]);
        window.MathJax.typesetPromise([targetEl]).catch((e) => console.warn("MathJax typeset:", e));
      }
    }

    function extractDriveId(url) {
      const s = String(url || "").trim();
      if (!s || (!s.includes("drive.google.com") && !s.includes("docs.google.com"))) return null;
      const patterns = [/\/file\/d\/([a-zA-Z0-9_-]{10,})/, /\/d\/([a-zA-Z0-9_-]{10,})/, /[?&]id=([a-zA-Z0-9_-]{10,})/];
      for (const re of patterns) {
        const m = s.match(re);
        if (m) return m[1];
      }
      return null;
    }

    function toDriveImage(url) {
      const s = String(url || "").trim();
      if (!s) return "";
      if (s.startsWith("data:")) return s;
      const id = extractDriveId(s);
      return id ? `https://drive.google.com/uc?export=view&id=${id}` : s;
    }

    function toDriveImageFallback(url) {
      const s = String(url || "").trim();
      if (!s) return "";
      if (s.startsWith("data:")) return s;
      const id = extractDriveId(s);
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1200` : s;
    }

    function extractYouTubeId(url) {
      const s = String(url || "").trim();
      if (!s) return null;
      const m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/)
        || s.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/)
        || s.match(/youtube\.com\/live\/([a-zA-Z0-9_-]{6,})/)
        || s.match(/youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{6,})/)
        || s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
      return m ? m[1] : null;
    }

    function toYouTubeThumbnail(url) {
      const id = extractYouTubeId(url);
      return id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : "";
    }

    function isVerticalVideo(url, format) {
      if (format === "VERTICAL") return true;
      if (format === "LANDSCAPE") return false;
      const low = String(url || "").toLowerCase();
      return low.includes("youtube.com/shorts/") || low.includes("instagram.com/reel") || low.includes("instagram.com/p/");
    }

    function isDirectVideoFile(url) {
      return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(String(url || "").trim());
    }

    function toVideoPreview(url) {
      const s = String(url || "").trim();
      if (!s) return "";
      const id = extractDriveId(s);
      if (id) return `https://drive.google.com/file/d/${id}/preview`;
      const ytId = extractYouTubeId(s);
      if (ytId) return `https://www.youtube-nocookie.com/embed/${ytId}?controls=1&fs=1&playsinline=1&rel=0&modestbranding=1`;
      const ig = s.match(/instagram\.com\/(?:reel|reels|p)\/([a-zA-Z0-9_-]+)/i);
      if (ig) return `https://www.instagram.com/p/${ig[1]}/embed/`;
      return s;
    }

    // --- Single-Language Fallback Resolvers (Matches Android CbtModels.kt) ---
    function resolveLocText(loc, lang) {
      if (!loc) return { text: "", isFallback: false, actualLang: null };
      if (typeof loc === "string") return { text: loc, isFallback: false, actualLang: lang };
      const en = String(loc.en || loc.english || "").trim();
      const hi = String(loc.hi || loc.hindi || "").trim();
      if (lang === "en") {
        if (en) return { text: en, isFallback: false, actualLang: "en" };
        if (hi) return { text: hi, isFallback: true, actualLang: "hi" };
      } else {
        if (hi) return { text: hi, isFallback: false, actualLang: "hi" };
        if (en) return { text: en, isFallback: true, actualLang: "en" };
      }
      return { text: "", isFallback: false, actualLang: null };
    }

    function resolveLocOptions(opts, lang, imgCount = 0) {
      const hasImgs = imgCount > 0;
      const blankSlots = () => Array(imgCount).fill("");
      if (!opts) return { options: hasImgs ? blankSlots() : ["Option A", "Option B", "Option C", "Option D"], isFallback: false };
      if (Array.isArray(opts)) return { options: opts.length ? opts : (hasImgs ? blankSlots() : []), isFallback: false };
      const en = Array.isArray(opts.en) ? opts.en : [];
      const hi = Array.isArray(opts.hi) ? opts.hi : [];
      const hasEn = en.some(x => String(x || "").trim().length > 0);
      const hasHi = hi.some(x => String(x || "").trim().length > 0);
      if (lang === "en") {
        if (hasEn) return { options: en.map((v, i) => (String(v || "").trim() ? v : (hi[i] || ""))), isFallback: false };
        if (hasHi) return { options: hi, isFallback: true };
      } else {
        if (hasHi) return { options: hi.map((v, i) => (String(v || "").trim() ? v : (en[i] || ""))), isFallback: false };
        if (hasEn) return { options: en, isFallback: true };
      }
      if (hasImgs) return { options: blankSlots(), isFallback: false };
      return { options: [], isFallback: false };
    }

    function resolveLocTable(tableData, lang) {
      if (!tableData) return { headers: [], rows: [], isFallback: false };
      const enTbl = tableData.en || (tableData.tableObj && tableData.tableObj.en) || null;
      const hiTbl = tableData.hi || (tableData.tableObj && tableData.tableObj.hi) || null;
      const valid = (t) => t && ((Array.isArray(t.headers) && t.headers.length > 0) || (Array.isArray(t.rows) && t.rows.length > 0));
      const enOk = valid(enTbl);
      const hiOk = valid(hiTbl);
      const enRowCount = enTbl && Array.isArray(enTbl.rows) ? enTbl.rows.length : 0;
      const hiRowCount = hiTbl && Array.isArray(hiTbl.rows) ? hiTbl.rows.length : 0;
      if (lang === "en") {
        if (enOk) return { headers: enTbl.headers || [], rows: enTbl.rows || [], isFallback: false };
        if (hiOk) return { headers: hiTbl.headers || [], rows: hiTbl.rows || [], isFallback: true };
      } else {
        const hiMatchesEn = !enOk || hiRowCount >= enRowCount;
        if (hiOk && hiMatchesEn) return { headers: hiTbl.headers || [], rows: hiTbl.rows || [], isFallback: false };
        if (enOk) return { headers: enTbl.headers || [], rows: enTbl.rows || [], isFallback: true };
        if (hiOk) return { headers: hiTbl.headers || [], rows: hiTbl.rows || [], isFallback: false };
      }
      return { headers: [], rows: [], isFallback: false };
    }

    function normalizeTestJson(rawInput) {
      const data = typeof rawInput === "string" ? JSON.parse(rawInput) : rawInput;
      const rawQs = Array.isArray(data) ? data : (data.questions || data.qList || data.items || data.data || []);
      if (!Array.isArray(rawQs) || rawQs.length === 0) throw new Error("No valid questions array found.");

      const normLoc = (v) => {
        if (!v) return null;
        if (typeof v === "string") return { en: v, hi: v };
        if (typeof v === "object") {
          const out = {};
          const en = Array.isArray(v.en) ? v.en.join("\n") : (v.en ?? v.english ?? "");
          const hi = Array.isArray(v.hi) ? v.hi.join("\n") : (v.hi ?? v.hindi ?? "");
          if (en) out.en = String(en);
          if (hi) out.hi = String(hi);
          return (out.en || out.hi) ? out : null;
        }
        return null;
      };

      const normTblGrid = (tbl) => {
        if (!tbl || typeof tbl !== "object") return null;
        const headers = Array.isArray(tbl.headers) ? tbl.headers.map(h => String(h ?? "")) : [];
        const rows = Array.isArray(tbl.rows) ? tbl.rows.map(r => Array.isArray(r) ? r.map(c => String(c ?? "")) : [String(r ?? "")]) : [];
        return (headers.length || rows.length) ? { headers, rows } : null;
      };

      const questions = rawQs.map((q, idx) => {
        const rawOpts = q.options || q.choices || q.answers || ["Option A", "Option B", "Option C", "Option D"];
        let normOpts = { en: [], hi: [] };
        if (Array.isArray(rawOpts)) {
          if (rawOpts.length && typeof rawOpts[0] === "object" && rawOpts[0] !== null) {
            normOpts.en = rawOpts.map(o => String(o.en || o.english || ""));
            normOpts.hi = rawOpts.map(o => String(o.hi || o.hindi || ""));
          } else {
            normOpts.en = rawOpts.map(String);
            normOpts.hi = rawOpts.map(String);
          }
        } else if (typeof rawOpts === "object") {
          normOpts.en = Array.isArray(rawOpts.en) ? rawOpts.en.map(x => String(x ?? "")) : [];
          normOpts.hi = Array.isArray(rawOpts.hi) ? rawOpts.hi.map(x => String(x ?? "")) : [];
        }

        const optImgs = Array.isArray(q.optionImages) ? q.optionImages.map(x => (x ? String(x).trim() : null)) : [];
        const maxOpts = Math.max(normOpts.en.length, normOpts.hi.length, optImgs.length, 1);

        let ans = q.correctAnswer ?? q.correct ?? q.ans ?? q.correctIndex ?? 0;
        if (typeof ans === "string") {
          const map = { A: 0, B: 1, C: 2, D: 3, E: 4 };
          const up = ans.trim().toUpperCase();
          ans = map[up] ?? (parseInt(up, 10) || 0);
        }
        const safeAns = Math.min(Math.max(0, Number(ans) || 0), maxOpts - 1);

        const stRaw = q.statementData && typeof q.statementData === "object" ? q.statementData : null;
        const statementData = stRaw ? {
          intro: normLoc(stRaw.intro),
          list: normLoc(stRaw.list),
          conclusion: normLoc(stRaw.conclusion)
        } : null;

        const tbRaw = q.tableData && typeof q.tableData === "object" ? q.tableData : null;
        const tbDirect = tbRaw && (Array.isArray(tbRaw.headers) || Array.isArray(tbRaw.rows)) ? tbRaw : null;
        const tbEn = tbRaw ? normTblGrid(tbRaw.en || (tbRaw.tableObj && tbRaw.tableObj.en) || tbDirect) : null;
        const tbHi = tbRaw ? normTblGrid(tbRaw.hi || (tbRaw.tableObj && tbRaw.tableObj.hi)) : null;
        const tableData = tbRaw ? {
          intro: normLoc(tbRaw.intro),
          en: tbEn,
          hi: tbHi
        } : null;

        const passageImg = (q.passage && typeof q.passage === "object" ? q.passage.image : null) || q.passageImage || null;

        return {
          id: q.id || (idx + 1),
          type: q.type || "standard",
          subjectTag: q.subjectTag || q.subject || "General",
          pyqTag: q.pyqTag || q.examTag || "CGPSC",
          image: q.image || q.img || null,
          optionImages: optImgs,
          passage: normLoc(q.passage),
          passageImage: passageImg,
          statementData,
          tableData,
          direction: normLoc(q.direction),
          assertion: normLoc(q.assertion),
          reason: normLoc(q.reason),
          question: normLoc(q.question || q.text || q.prompt) || { en: "", hi: "" },
          options: normOpts,
          correctIndex: safeAns,
          explanation: normLoc(q.explanation || q.solution) || { en: "No explanation provided.", hi: "स्पष्टीकरण उपलब्ध नहीं है।" },
          explanationImage: q.explanationImage || q.solutionImage || null
        };
      });

      return {
        title: Array.isArray(data) ? "Custom Mock Test" : (data.title || data.testName || data.name || "Mock Test"),
        durationMinutes: Math.max(1, parseInt(data.durationMinutes || data.duration || 30, 10) || 30),
        marksCorrect: parseFloat(data.positiveMarks ?? data.marksCorrect ?? 2.0) || 2.0,
        marksNegative: parseFloat(data.negativeMarks ?? data.marksNegative ?? 0.66) || 0.0,
        questions
      };
    }

    function toMillis(ts) {
      if (!ts) return 0;
      if (typeof ts.toMillis === "function") return ts.toMillis();
      if (typeof ts.seconds === "number") return ts.seconds * 1000;
      return Number(ts) || 0;
    }

    function fmtDate(ms) {
      if (!ms) return "-";
      return new Date(ms).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function fmtCountdown(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return d > 0 ? `${d}d ${h}h ${m}m ${sec}s` : `${pad(h)}h ${pad(m)}m ${pad(sec)}s`;
    }

    function fmtTimer(sec) {
      const s = Math.max(0, sec);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
    }

    const cleanedSchedSession = new Set();
    async function cleanupEndedScheduledTests(manual = false) {
      if (!isAdmin()) return 0;
      const now = Date.now();
      const targets = state.catalog.scheduled.filter(s =>
        now > s.windowEndMs && !s.questionsCleaned && (manual || !cleanedSchedSession.has(s.testId))
      );
      if (!targets.length) return 0;
      let removedCount = 0;
      for (const s of targets) {
        cleanedSchedSession.add(s.testId);
        try {
          await deleteDoc(doc(db, "scheduledTests", s.testId));
          await updateDoc(doc(db, "portalData", "testCatalog"), {
            [`scheduled.${s.testId}.questionsCleaned`]: true,
            updatedAt: serverTimestamp()
          });
          removedCount++;
        } catch (err) {
          console.warn("Cleanup scheduled payload:", s.testId, err);
        }
      }
      if (removedCount > 0) {
        showBanner(`Auto-cleaned ${removedCount} ended scheduled test file(s) from Firebase (Merit records preserved for Admin).`);
      }
      return removedCount;
    }

    let isSigningIn = false;
    function openSignInModal() {
      const protocolWarnHtml = isUnsupportedFileContext ? `
        <div style="background:var(--amber-100);color:#78350f;padding:12px;border-radius:12px;font-size:12.5px;margin:12px 0;line-height:1.5;">
          <strong>Google Sign-In cannot run on <code>${esc(window.location.protocol)}</code> (File Explorer / Local HTML).</strong><br/>
          Google OAuth requires an <code>https://</code> or <code>http://localhost</code> URL.<br/>
          &bull; <strong>Easiest Mobile Fix (Zero Coding):</strong> Rename this file to <code>index.html</code> &amp; drag-drop it to <strong>Netlify Drop</strong> or <strong>Firebase Hosting</strong>, then add that URL under <em>Firebase Console &rarr; Authentication &rarr; Authorized domains</em>.<br/>
          &bull; Or use the <strong>Play Local JSON File</strong> option inside Tests tab right now without logging in.
        </div>
      ` : "";
      openModal(`
        <h2 style="margin:0 0 8px;">Sign In to Attempt Test</h2>
        <p style="color:var(--slate-500);font-size:14px;margin:0;">Browse the dashboard freely anytime. Sign in with Google once to get your official Roll Number, attempt tests, and appear on Merit Rank Lists.</p>
        ${protocolWarnHtml}
        <div id="authModalError" style="color:var(--rose-600);font-size:12.5px;font-weight:600;margin-top:8px;"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
          <button class="btn btn-outline" id="mCancel">Cancel</button>
          <button class="btn btn-navy" id="mGoogleSignIn">Continue with Google</button>
        </div>
      `);
      document.getElementById("mCancel").onclick = closeModal;
      document.getElementById("mGoogleSignIn").onclick = async () => {
        const errBox = document.getElementById("authModalError");
        if (isUnsupportedFileContext) {
          errBox.textContent = "Cannot open Google Sign-In from content:// or file://. Open via https:// or http://localhost.";
          return;
        }
        if (isSigningIn) return;
        isSigningIn = true;
        const btn = document.getElementById("mGoogleSignIn");
        btn.disabled = true;
        btn.textContent = "Connecting to Google...";
        errBox.textContent = "";

        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        try {
          await setPersistence(auth, browserLocalPersistence);
          await signInWithPopup(auth, provider);
          isSigningIn = false;
        } catch (err) {
          if (
            err.code === "auth/popup-blocked" ||
            err.code === "auth/cancelled-popup-request" ||
            err.code === "auth/operation-not-supported-in-this-environment"
          ) {
            try {
              btn.textContent = "Redirecting to Google...";
              await signInWithRedirect(auth, provider);
              return;
            } catch (rErr) {
              errBox.textContent = "Redirect Sign-In Error: " + rErr.message;
            }
          } else if (err.code === "auth/unauthorized-domain") {
            errBox.textContent = `Domain "${window.location.hostname}" is not authorized yet. Add it in Firebase Console -> Authentication -> Authorized domains.`;
          } else if (err.code !== "auth/popup-closed-by-user") {
            errBox.textContent = "Google Sign-In Error: " + err.message;
          }
          isSigningIn = false;
          btn.disabled = false;
          btn.textContent = "Continue with Google";
        }
      };
    }

    // --- Action Gate ---
    function gateAction(action) {
      if (!state.user) { state.pendingAction = action; openSignInModal(); return; }
      if (!state.profile) { state.pendingAction = action; openRegistrationModal(false); return; }
      executeAction(action);
    }

    async function executeAction(action) {
      try {
        if (action.type === "PRACTICE") {
          const summary = state.catalog.practice.find(x => x.testId === action.testId);
          if (summary && summary.jsonUrl) {
            const sep = summary.jsonUrl.includes("?") ? "&" : "?";
            const resp = await fetch(`${summary.jsonUrl}${sep}t=${Date.now()}`);
            if (!resp.ok) throw new Error(`Failed to fetch practice test JSON from GitHub (HTTP ${resp.status}).`);
            const rawText = await resp.text();
            const parsed = normalizeTestJson(rawText);
            startExamPlayer({
              testId: action.testId,
              isScheduled: false,
              mode: action.mode,
              title: summary.title || parsed.title,
              durationMinutes: summary.durationMinutes || parsed.durationMinutes,
              marksCorrect: summary.marksCorrect ?? parsed.marksCorrect,
              marksNegative: summary.marksNegative ?? parsed.marksNegative,
              questions: parsed.questions || []
            });
          } else {
            const snap = await getDoc(doc(db, "practiceTests", action.testId));
            if (!snap.exists()) return showBanner("Practice test not found.");
            const d = snap.data();
            const parsed = normalizeTestJson({ title: d.title, durationMinutes: d.durationMinutes, positiveMarks: d.marksCorrect, negativeMarks: d.marksNegative, questions: d.questions || [] });
            startExamPlayer({
              testId: action.testId, isScheduled: false, mode: action.mode,
              title: d.title || parsed.title, durationMinutes: d.durationMinutes || parsed.durationMinutes,
              marksCorrect: d.marksCorrect ?? parsed.marksCorrect, marksNegative: d.marksNegative ?? parsed.marksNegative,
              questions: parsed.questions
            });
          }
        } else if (action.type === "SCHEDULED") {
          const s = action.summary;
          const now = Date.now();
          if (now < s.windowStartMs) return alert(`Exam opens on ${fmtDate(s.windowStartMs)}.`);
          if (now > s.windowEndMs) {
            if (isAdmin()) return openRankModal(s);
            return alert("Test Ended. Official Merit List PDF will be posted in the Dashboard Merit Lists section.");
          }
          const attemptSnap = await getDoc(doc(db, "users", state.user.uid, "attempts", s.testId));
          if (attemptSnap.exists()) {
            return alert(`Single Attempt Completed! Score: ${attemptSnap.data().totalScore}. Official Merit List PDF will be shared after exam ends.`);
          }
          const testSnap = await getDoc(doc(db, "scheduledTests", s.testId));
          if (!testSnap.exists()) return showBanner("Scheduled test ended and its question file has been cleaned.");
          const d = testSnap.data();
          const parsed = normalizeTestJson({ title: d.title, durationMinutes: d.durationMinutes, positiveMarks: d.marksCorrect, negativeMarks: d.marksNegative, questions: d.questions || [] });
          startExamPlayer({
            testId: s.testId, isScheduled: true, mode: "TEST",
            title: d.title || parsed.title, durationMinutes: d.durationMinutes || parsed.durationMinutes,
            marksCorrect: d.marksCorrect ?? parsed.marksCorrect, marksNegative: d.marksNegative ?? parsed.marksNegative,
            questions: parsed.questions
          });
        } else if (action.type === "CODE") {
          const q = query(collection(db, "scheduledTests"), where("testCode", "==", action.code), limit(1));
          const qs = await getDocs(q);
          if (qs.empty) return alert(`No scheduled test found for code "${action.code}".`);
          const docSnap = qs.docs[0];
          const v = docSnap.data();
          executeAction({
            type: "SCHEDULED",
            summary: { ...v, testId: docSnap.id, windowStartMs: toMillis(v.windowStartAt), windowEndMs: toMillis(v.windowEndAt) }
          });
        }
      } catch (err) {
        alert("Unable to launch exam: " + err.message);
      }
    }

            <span style="font-size:12px;color:var(--slate-500);">${attempted ? "Attempt submitted • Result via Admin PDF" : `Closes in <strong class="mono" data-countdown-target="${s.windowEndMs}">${fmtCountdown(s.windowEndMs - now)}</strong>`}</span>

        badge = `<span class="badge badge-rose">TEST ENDED</span>`;

    function renderScheduledSectionHtml(list, emptyMsg = "") {
      const cat = state.schedCatFilter || "ALL";
      const counts = {
        ALL: list.length,
        DAILY: list.filter(x => (x.scheduleCategory || "DAILY") === "DAILY").length,
        WEEKLY: list.filter(x => x.scheduleCategory === "WEEKLY").length,
        MONTHLY: list.filter(x => x.scheduleCategory === "MONTHLY").length
      };
      const tabsHtml = [
        ["ALL", `All (${counts.ALL})`],
        ["DAILY", `Daily (${counts.DAILY})`],
        ["WEEKLY", `Weekly (${counts.WEEKLY})`],
        ["MONTHLY", `Monthly (${counts.MONTHLY})`]
      ].map(([k, lbl]) => `<button type="button" class="sched-tab-pill ${cat === k ? "active" : ""}" data-sched-cat="${k}">${lbl}</button>`).join("");

      const filtered = cat === "ALL" ? list : list.filter(x => (x.scheduleCategory || "DAILY") === cat);
      const cardsHtml = filtered.map(s => renderScheduledCardHtml(s, true)).join("");
      return `
        <div class="stack" style="gap:10px;">
          <div class="sched-tabs">${tabsHtml}</div>
          ${cardsHtml ? `<div class="sched-slider">${cardsHtml}</div>` : (emptyMsg ? `<div class="card">${emptyMsg}</div>` : `<div class="card">No ${cat.toLowerCase()} scheduled tests right now.</div>`)}
        </div>
      `;
    }

          renderPortalTabs();

      rootEl.querySelectorAll("[data-join-sched]").forEach(btn => {
        btn.onclick = () => {
          const s = state.catalog.scheduled.find(x => x.testId === btn.getAttribute("data-join-sched"));
          if (s) gateAction({ type: "SCHEDULED", summary: s });
        };

      rootEl.querySelectorAll("[data-play-prac]").forEach(btn => {

          gateAction({ type: "PRACTICE", testId: btn.getAttribute("data-play-prac"), mode: btn.getAttribute("data-mode") });

    function openLocalJsonModal() {
      openModal(`
        <h2 style="margin:0 0 10px;">Play Local JSON Test</h2>
        <div class="stack" style="gap:10px;">
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="file" id="localFilePick" accept=".json,.txt" />
            <button class="btn btn-outline" id="loadSampleBtn" style="white-space:nowrap;">Load Demo</button>
          </div>
          <textarea id="localJsonText" rows="7" placeholder="Paste test JSON here...">${esc(JSON.stringify(DEFAULT_SAMPLE_JSON, null, 2))}</textarea>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" style="flex:1;" id="startLocalTest">Start Test Mode</button>
            <button class="btn btn-purple" style="flex:1;" id="startLocalQuiz">Start Quiz Mode</button>
          </div>
        </div>
      `);
      document.getElementById("localFilePick").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { document.getElementById("localJsonText").value = r.result; };
        r.readAsText(f);
      };
      document.getElementById("loadSampleBtn").onclick = () => {
        document.getElementById("localJsonText").value = JSON.stringify(DEFAULT_SAMPLE_JSON, null, 2);
      };
      const launch = (mode) => {
        try {
          const parsed = normalizeTestJson(document.getElementById("localJsonText").value);
          closeModal();
          startExamPlayer({ testId: `local_${Date.now()}`, isScheduled: false, mode, ...parsed });
        } catch (err) { alert("Invalid JSON: " + err.message); }
      };
      document.getElementById("startLocalTest").onclick = () => launch("TEST");
      document.getElementById("startLocalQuiz").onclick = () => launch("QUIZ");
    }

    // --- Admin-Only Merit Rank List & Printable PDF ---
    async function openRankModal(summary) {
      if (!isAdmin()) {
        return showBanner("Official Merit Rank List PDFs are posted by Admin in the Dashboard Merit Lists section.");
      }
      openModal(`<p>Loading Official Merit Sheet...</p>`, true);
      try {
        const snap = await getDoc(doc(db, "testMeritSheets", summary.testId));
        const rawEntries = snap.exists() ? Object.values(snap.data().entries || {}) : [];
        const sorted = rawEntries.sort((a, b) =>
          (b.totalScore - a.totalScore) || (b.accuracyPercent - a.accuracyPercent) || (a.timeTakenSeconds - b.timeTakenSeconds)
        ).map((e, i) => ({ ...e, rank: i + 1 }));

        const podium = sorted.slice(0, 3).map(e => `

        openModal(`

            <div>
              <h2 style="margin:0;">${esc(summary.title)} — Merit Rank List</h2>

          </div>
          ${sorted.length ? `<div class="podium-grid">${podium}</div><table><thead><tr><th>Rank</th><th>Student Name</th><th>Roll Number</th><th>Total Marks</th><th>Accuracy</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table>` : `<p>No student submissions recorded yet.</p>`}
        `, true);

        document.getElementById("closeRankBtn").onclick = closeModal;
        document.getElementById("printRankPdfBtn").onclick = () => {
          const logo = state.config.resolvedLogoUrl || toDriveImage(state.config.logoDriveUrl);
          document.getElementById("printArea").innerHTML = `

              <div style="display:flex;align-items:center;gap:12px;">
                ${logo ? `<img src="${esc(logo)}" style="height:44px;object-fit:contain;" />` : ""}
                <div><h1 style="margin:0;font-size:20px;">${esc(summary.instituteName || state.config.instituteName)}</h1><div style="color:#fcd34d;font-size:12px;font-weight:700;">${esc(state.config.portalTitle)} • OFFICIAL MERIT RANK LIST</div></div>
              </div>
              <div style="text-align:right;font-size:11px;"><div>CODE: <strong>${esc(summary.testCode)}</strong></div><div>Candidates: ${sorted.length}</div></div>
            </div>

            <div class="podium-grid">${podium}</div>

    // --- Locked CBT Test Player (Mobile-First + Collapsible Bottom Palette + All 5 Question Types) ---
    let timerInterval = null;
    function startExamPlayer(session) {
      state.player = {
        ...session,
        idx: 0,
        lang: "en",
        paletteOpen: false,
        remainingSec: session.durationMinutes * 60,
        responses: session.questions.map((_, i) => ({ selected: null, status: i === 0 ? "NOT_ANSWERED" : "NOT_VISITED" })),
        submitted: false,
        warnings: 0,
        result: null
      };
      document.body.classList.add("in-player");
      document.getElementById("viewPortal").classList.add("hidden");
      document.getElementById("viewPlayer").classList.remove("hidden");
      renderPlayer();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!state.player || state.player.submitted) return;
        state.player.remainingSec--;
        const tEl = document.getElementById("playerTimerText");
        if (tEl) tEl.textContent = fmtTimer(state.player.remainingSec);
        if (state.player.remainingSec <= 0) {
          clearInterval(timerInterval);
          submitActiveExam();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state.player && state.player.isScheduled && !state.player.submitted) {

    function renderPlayer() {

      const ro = resolveLocOptions(q.options, p.lang, optImgs.length);
      const rexp = resolveLocText(q.explanation, p.lang);
      const rpass = resolveLocText(q.passage, p.lang);
      const rdir = resolveLocText(q.direction, p.lang);
      const rass = resolveLocText(q.assertion, p.lang);
      const rrea = resolveLocText(q.reason, p.lang);

      const stIntro = q.statementData ? resolveLocText(q.statementData.intro, p.lang) : { text: "", isFallback: false };
      const stList = q.statementData ? resolveLocText(q.statementData.list, p.lang) : { text: "", isFallback: false };
      const stConc = q.statementData ? resolveLocText(q.statementData.conclusion, p.lang) : { text: "", isFallback: false };

      const tbIntro = q.tableData ? resolveLocText(q.tableData.intro, p.lang) : { text: "", isFallback: false };
      const tbGrid = q.tableData ? resolveLocTable(q.tableData, p.lang) : { headers: [], rows: [], isFallback: false };

      const notAnsCount = p.responses.filter(r => r.status === "NOT_ANSWERED").length;
      const markedCount = p.responses.filter(r => r.status === "MARKED").length;
      const notVisCount = p.responses.filter(r => r.status === "NOT_VISITED").length;
      const corrCount = p.submitted ? p.questions.filter((qq, i) => p.responses[i].selected === qq.correctIndex).length : 0;
      const wrongCount = p.submitted ? p.questions.filter((qq, i) => p.responses[i].selected !== null && p.responses[i].selected !== qq.correctIndex).length : 0;
      const skipCount = p.submitted ? p.questions.filter((_, i) => p.responses[i].selected === null).length : 0;

      const paletteHtml = p.questions.map((qq, i) => {
        const st = p.responses[i].status;

        if (p.submitted) {
          cls = sel === null ? "" : (sel === qq.correctIndex ? "answered" : "not-answered");

        return `<button class="q-pill ${cls} ${i === p.idx ? "current" : ""}" data-qidx="${i}">${i + 1}</button>`;
      }).join("");

      const slotCount = Math.max(ro.options.length, optImgs.length);
      const optsHtml = Array.from({ length: slotCount }).map((_, oIdx) => {

        return `
          <button class="option-btn ${cls}" ${p.submitted ? "disabled" : ""} data-opt="${oIdx}">
            <span class="opt-circle">${String.fromCharCode(65 + oIdx)}</span>

              ${String(optText).trim() ? `<div>${formatRichHtml(optText)}</div>` : ""}

            </div>

              <span id="playerTimerText" class="mono">${fmtTimer(p.remainingSec)}</span>
            </div>
            <div class="lang-switch" role="group" aria-label="Question Language">

              <button type="button" class="lang-opt ${p.lang === "hi" ? "active" : ""}" id="langHiBtn">हिंदी</button>
            </div>
          </header>

          <div class="player-layout">
            <div class="card stack" style="gap:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                <strong class="mono" style="font-size:13.5px;color:var(--navy-900);">Q.${p.idx + 1} / ${p.questions.length}</strong>
                <div class="q-meta-strip">
                  <span class="q-meta-subj">${esc(q.subjectTag || "General")}</span>
                  ${q.pyqTag ? `<span style="color:var(--slate-400);">&bull;</span><span class="q-meta-pyq">${esc(q.pyqTag)}</span>` : ""}
                </div>
              </div>

              ${(rpass.text || q.passageImage) ? `
                <div class="q-passage-box">
                  <div style="font-size:11px;font-weight:800;color:var(--royal-600);margin-bottom:4px;">PASSAGE / COMPREHENSION</div>
                  ${rpass.text ? `<div>${formatRichHtml(rpass.text)}</div>` : ""}
                  ${q.passageImage ? `<img src="${esc(toDriveImage(q.passageImage))}" onerror="this.src='${esc(toDriveImageFallback(q.passageImage))}';this.onerror=null;" style="max-height:220px;max-width:100%;object-fit:contain;border-radius:10px;margin-top:8px;" />` : ""}

              ${hasStatement ? `

                  ${stList.text ? `<div style="line-height:1.65;">${formatRichHtml(stList.text)}</div>` : ""}

              ${rdir.text ? `<div class="q-dir-box">${formatRichHtml(rdir.text)}</div>` : ""}

              ${hasAssertion ? `

                  ${rass.text ? `<div class="q-ar-row"><strong>Assertion (A):</strong> ${formatRichHtml(rass.text)}</div>` : ""}
                  ${rrea.text ? `<div class="q-ar-row"><strong>Reason (R):</strong> ${formatRichHtml(rrea.text)}</div>` : ""}
                </div>

              ${tblHtml}

              ${q.image ? `<img src="${esc(toDriveImage(q.image))}" onerror="this.src='${esc(toDriveImageFallback(q.image))}';this.onerror=null;" style="max-height:250px;max-width:100%;object-fit:contain;border-radius:10px;margin:0 auto;display:block;" alt="Question visual" />` : ""}

              <div class="player-actions-bar">

                ${!p.submitted ? `<span><i class="leg-dot" style="background:var(--purple-600);"></i>Marked (${markedCount})</span>` : ""}
                <span><i class="leg-dot" style="background:var(--slate-100);border:1px solid var(--slate-200);"></i>${p.submitted ? `Skipped (${skipCount})` : `Not Visited (${notVisCount})`}</span>

          ${!p.paletteOpen ? `

              ${!p.submitted
                ? `<button class="btn btn-emerald" id="submitExamMobileBtn" style="width:100%;">Submit Test &amp; View Result</button>`

        document.getElementById("viewPlayer").classList.add("hidden");
        document.getElementById("viewPortal").classList.remove("hidden");
        renderPortalTabs();
      };
      document.getElementById("langEnBtn").onclick = () => { if (p.lang !== "en") { p.lang = "en"; renderPlayer(); } };
      document.getElementById("langHiBtn").onclick = () => { if (p.lang !== "hi") { p.lang = "hi"; renderPlayer(); } };
      document.getElementById("togglePaletteBtn").onclick = () => { p.paletteOpen = !p.paletteOpen; renderPlayer(); };
      el.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {

        renderPlayer();

      el.querySelectorAll("[data-qidx]").forEach(b => b.onclick = () => {
        p.idx = Number(b.getAttribute("data-qidx"));
        if (p.responses[p.idx].status === "NOT_VISITED") p.responses[p.idx].status = "NOT_ANSWERED";
        renderPlayer();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      document.getElementById("clearOptBtn").onclick = () => { p.responses[p.idx] = { selected: null, status: "NOT_ANSWERED" }; renderPlayer(); };
      document.getElementById("prevQBtn").onclick = () => { if (p.idx > 0) { p.idx--; renderPlayer(); } };

        if (p.idx < p.questions.length - 1) p.idx++;

          renderPlayer();

          if (confirm("Submit test now?")) submitActiveExam();
        }
      };

      });

        const resBtn = document.getElementById(id);
        if (resBtn) resBtn.onclick = showPlayerScoreModal;
      });
      typesetMath(el);

    async function submitActiveExam() {
      const p = state.player;
      if (!p || p.submitted) return;
      clearInterval(timerInterval);
      p.submitted = true;

      let correctCount = 0, wrongCount = 0, unattemptedCount = 0;
      const selectedOptions = p.questions.map((q, i) => {
        const sel = p.responses[i].selected;
        if (sel === null || sel === undefined) { unattemptedCount++; return -1; }
        if (sel === q.correctIndex) correctCount++; else wrongCount++;
        return sel;
      });
      const raw = correctCount * p.marksCorrect;
      const neg = wrongCount * p.marksNegative;
      const totalScore = Math.max(0, raw - neg);
      const maxScore = p.questions.length * p.marksCorrect;
      const attempted = correctCount + wrongCount;
      const accuracyPercent = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;
      const timeTakenSeconds = Math.max(0, p.durationMinutes * 60 - p.remainingSec);

      p.result = { correctCount, wrongCount, unattemptedCount, totalScore, maxScore, accuracyPercent, timeTakenSeconds, neg };
      renderPlayer();
      showPlayerScoreModal();

      if (state.user && state.profile && !String(p.testId).startsWith("local_")) {
        try {
          if (p.isScheduled) {
            await updateDoc(doc(db, "testMeritSheets", p.testId), {
              [`entries.${state.user.uid}`]: {
                uid: state.user.uid, studentName: state.profile.studentName, rollNumber: state.profile.rollNumber,
                totalScore, maxScore, correctCount, wrongCount, unattemptedCount,
                accuracyPercent, timeTakenSeconds, appSwitchWarnings: p.warnings, submittedAt: serverTimestamp()
              },
              updatedAt: serverTimestamp()
            });
          }
          const attemptId = p.isScheduled ? p.testId : `${p.testId}_${Date.now()}`;
          await setDoc(doc(db, "users", state.user.uid, "attempts", attemptId), {
            userId: state.user.uid, testId: p.testId, testTitle: p.title, mode: p.mode,
            rollNumber: state.profile.rollNumber, studentName: state.profile.studentName,
            correctCount, wrongCount, unattemptedCount, totalScore, maxScore,
            accuracyPercent, timeTakenSeconds, appSwitchWarnings: p.warnings,
            selectedOptions, submittedAt: serverTimestamp()
          });
          showBanner(p.isScheduled ? "Score recorded in Official Merit Sheet!" : "Attempt saved to My Results!");
        } catch (err) {
          alert("Score sync warning: " + err.message);
        }
      }
    }

    function showPlayerScoreModal() {
      const p = state.player, r = p.result;
      openModal(`
        <h2 style="margin:0 0 6px;">Official Score Card</h2>
        <div style="font-size:13px;color:var(--slate-500);margin-bottom:14px;">${esc(p.title)} • ${esc(state.profile?.studentName || "Candidate")} (${esc(state.profile?.rollNumber || "LOCAL")})</div>
        <div class="grid-3">

                state.editingPracticeCreatedAt = d.createdAt || null;
                document.getElementById("pracJson").value = JSON.stringify({
                  title: d.title,
                  durationMinutes: d.durationMinutes,
                  positiveMarks: d.marksCorrect,
                  negativeMarks: d.marksNegative,
                  questions: d.questions || []
                }, null, 2);
              }
            }
          } catch (err) {
            alert("Loaded metadata; paste updated JSON if needed: " + err.message);
          }
        });
        el.querySelectorAll("[data-del-prac]").forEach(b => b.onclick = async () => {
          const id = b.getAttribute("data-del-prac");
          const item = state.catalog.practice.find(x => x.testId === id);
          if (!confirm("Delete this practice test?")) return;
          try {
            const cfg = ghGetConfig();
            if (item && item.githubPath && ghIsConfigured(cfg)) {
              await ghDeleteFile(cfg, item.githubPath, `Delete practice test ${item.title}`);
            }
            await deleteDoc(doc(db, "practiceTests", id)).catch(() => {});
            await updateDoc(doc(db, "portalData", "testCatalog"), { [`practice.${id}`]: deleteField(), updatedAt: serverTimestamp() });
            showBanner("Practice test deleted.");
          } catch (err) {
            alert("Delete Failed: " + err.message);
          }
        });
      } else {
        document.getElementById("scFilePick").onchange = (e) => {
          const f = e.target.files[0]; if (!f) return;
          const r = new FileReader(); r.onload = () => { document.getElementById("scJson").value = r.result; }; r.readAsText(f);
        };
        document.getElementById("loadScDemoBtn").onclick = () => {
          document.getElementById("scJson").value = JSON.stringify(DEFAULT_SAMPLE_JSON, null, 2);
        };
        document.getElementById("pubSchedBtn").onclick = async () => {
          const btn = document.getElementById("pubSchedBtn");
          btn.disabled = true;
          try {
            let parsed;
            try {
              parsed = normalizeTestJson(document.getElementById("scJson").value);
            } catch (e) {
              throw new Error(`[Step: Parse JSON] ${e.message}`);
            }
            const limitedQuestions = parsed.questions.slice(0, 500);
            const testId = `sched_${Date.now()}`;
            const testCode = "CG" + Math.random().toString(36).substring(2, 6).toUpperCase();
            const title = (document.getElementById("scTitle").value.trim() || parsed.title).slice(0, 160);
            const scheduleCategory = document.getElementById("scCat").value || "DAILY";
            const durInput = parseInt(document.getElementById("scDur").value, 10);
            const durationMinutes = Math.min(600, Math.max(1, Number.isFinite(durInput) ? durInput : parsed.durationMinutes));
            const posInput = parseFloat(document.getElementById("scPos").value);
            const marksCorrect = Number.isFinite(posInput) ? Math.max(0.1, posInput) : parsed.marksCorrect;
            const negInput = parseFloat(document.getElementById("scNeg").value);
            const marksNegative = Number.isFinite(negInput) ? Math.max(0, negInput) : 0;
            const startTs = Timestamp.fromDate(new Date(document.getElementById("scStart").value));
            const endTs = Timestamp.fromDate(new Date(document.getElementById("scEnd").value));
            if (endTs.toMillis() <= startTs.toMillis()) throw new Error("[Step: Validate Schedule] End date/time must be after start.");
            try {
              await setDoc(doc(db, "scheduledTests", testId), {
                adminUid: state.user.uid, testCode, title, instituteName: state.config.instituteName,
                scheduleCategory, durationMinutes, marksCorrect, marksNegative, questionCount: limitedQuestions.length,
                windowStartAt: startTs, windowEndAt: endTs, questions: limitedQuestions,
                createdAt: serverTimestamp(), updatedAt: serverTimestamp()
              });
            } catch (e) {
              throw new Error(`[Step: Save scheduledTests/${testId}] ${e.message}`);
            }
            try {
              await setDoc(doc(db, "testMeritSheets", testId), {
                testId, windowStartAt: startTs, windowEndAt: endTs, entries: {}, updatedAt: serverTimestamp()
              });
            } catch (e) {
              throw new Error(`[Step: Save testMeritSheets/${testId}] ${e.message}`);
            }
            try {
              await upsertCatalog("scheduled", testId, {
                testId, testCode, title, instituteName: state.config.instituteName, scheduleCategory,
                durationMinutes, marksCorrect, marksNegative, questionCount: limitedQuestions.length,
                windowStartAt: startTs, windowEndAt: endTs, questionsCleaned: false
              });
            } catch (e) {
              throw new Error(`[Step: Save portalData/testCatalog] ${e.message}`);
            }
            showBanner(`Scheduled "${title}" (${scheduleCategory}) • Code: ${testCode}`);
          } catch (err) {
            alert("Publish Failed: " + err.message);
          } finally {
            btn.disabled = false;
          }
        };
        document.getElementById("cleanupEndedBtn").onclick = async () => {
          const n = await cleanupEndedScheduledTests(true);
          if (!n) showBanner("No pending ended test files to clean.");
          renderAdminTab();
        };
        document.getElementById("addMeritLinkBtn").onclick = async () => {
          const testTitle = document.getElementById("meritTitleInp").value.trim();
          const category = document.getElementById("meritCatInp").value || "DAILY";
          const examDate = document.getElementById("meritDateInp").value.trim();
          const telegramUrl = document.getElementById("meritUrlInp").value.trim();
          if (!testTitle || !telegramUrl) return alert("Enter Exam Name and Telegram PDF URL.");
          state.config.meritListLinks = [
            { id: `ml_${Date.now()}`, testTitle, category, examDate, telegramUrl, orderIndex: 0 },
            ...(state.config.meritListLinks || [])
          ].map((m, i) => ({ ...m, orderIndex: i }));
          await saveConfigToFirestore();
          renderAdminTab();
        };
        el.querySelectorAll("[data-del-merit-link]").forEach(b => b.onclick = async () => {
          const idx = Number(b.getAttribute("data-del-merit-link"));
          state.config.meritListLinks.splice(idx, 1);
          await saveConfigToFirestore();
          renderAdminTab();
        });
        el.querySelectorAll("[data-adm-rank]").forEach(b => b.onclick = () => {
          const s = state.catalog.scheduled.find(x => x.testId === b.getAttribute("data-adm-rank"));
          if (s) openRankModal(s);
        });
        el.querySelectorAll("[data-adm-del-sched]").forEach(b => b.onclick = async () => {
          const id = b.getAttribute("data-adm-del-sched");
          if (!confirm("Delete scheduled exam?")) return;
          await deleteDoc(doc(db, "scheduledTests", id)).catch(() => {});
          await deleteDoc(doc(db, "testMeritSheets", id)).catch(() => {});
          await updateDoc(doc(db, "portalData", "testCatalog"), { [`scheduled.${id}`]: deleteField(), updatedAt: serverTimestamp() });
        });
        document.getElementById("syncUsersBtn").onclick = async () => {
          const snap = await getDoc(doc(db, "portalData", "userRegistry"));
          state.adminUsers = snap.exists() ? Object.values(snap.data().users || {}) : [];
          renderAdminTab();
        };
      }
    }

    async function saveConfigToFirestore() {
      state.config.blocks.forEach((b, i) => b.orderIndex = i);
      state.config.socialLinks.forEach((s, i) => s.orderIndex = i);
      (state.config.meritListLinks || []).forEach((m, i) => m.orderIndex = i);
      await setDoc(doc(db, "portalData", "dashboardConfig"), {
        portalTitle: state.config.portalTitle,
        instituteName: state.config.instituteName,
        logoDriveUrl: state.config.logoDriveUrl,
        resolvedLogoUrl: state.config.resolvedLogoUrl,
        apkDownloadUrl: state.config.apkDownloadUrl || "",
        playStoreUrl: state.config.playStoreUrl || "",
        blocks: state.config.blocks,
        socialLinks: state.config.socialLinks,
        meritListLinks: state.config.meritListLinks || [],
        updatedAt: serverTimestamp()
      });
      showBanner("Portal Branding & CMS saved live!");
    }

    async function upsertCatalog(bucket, testId, obj) {
      const catRef = doc(db, "portalData", "testCatalog");
      const snap = await getDoc(catRef);
      if (!snap.exists()) {
        await setDoc(catRef, {
          scheduled: bucket === "scheduled" ? { [testId]: obj } : {},
          practice: bucket === "practice" ? { [testId]: obj } : {},
          updatedAt: serverTimestamp()
        });
      } else {
        await updateDoc(catRef, {
          [`${bucket}.${testId}`]: obj,
          updatedAt: serverTimestamp()
        });
      }
    }

    renderHeader();
    renderPortalTabs();
  </script>
</body>
</html>
