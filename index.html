      background: #fff;

    function extractDriveId(url) {
      const s = String(url || "").trim();
      if (!s || (!s.includes("drive.google.com") && !s.includes("docs.google.com"))) return null;
      const patterns = [/\/file\/d\/([a-zA-Z0-9_-]{10,})/, /\/d\/([a-zA-Z0-9_-]{10,})/, /[?&]id=([a-zA-Z0-9_-]{10,})/];
      for (const re of patterns) {
        const m = s.match(re);
        if (m) return m[1];
      }
      return null;
    }

    function toDriveImage(url) {

      const s = String(url || "").trim();

    function resolveLocText(loc, lang) {
      if (!loc) return { text: "", isFallback: false, actualLang: null };
      if (typeof loc === "string") return { text: loc, isFallback: false, actualLang: lang };
      const en = (loc.en || loc.english || "").trim();
      const hi = (loc.hi || loc.hindi || "").trim();
      if (lang === "en") {
        if (en) return { text: en, isFallback: false, actualLang: "en" };
        if (hi) return { text: hi, isFallback: true, actualLang: "hi" };
      } else {
        if (hi) return { text: hi, isFallback: false, actualLang: "hi" };
        if (en) return { text: en, isFallback: true, actualLang: "en" };
      }
      return { text: "", isFallback: false, actualLang: null };
    }

    function resolveLocOptions(opts, lang) {
      if (!opts) return { options: ["Option A", "Option B", "Option C", "Option D"], isFallback: false };
      if (Array.isArray(opts)) return { options: opts, isFallback: false };
      const en = Array.isArray(opts.en) ? opts.en : [];
      const hi = Array.isArray(opts.hi) ? opts.hi : [];
      const hasEn = en.some(x => String(x || "").trim().length > 0);
      const hasHi = hi.some(x => String(x || "").trim().length > 0);
      if (lang === "en") {
        if (hasEn) return { options: en.map((v, i) => (String(v || "").trim() ? v : (hi[i] || ""))), isFallback: false };
        if (hasHi) return { options: hi, isFallback: true };
      } else {
        if (hasHi) return { options: hi.map((v, i) => (String(v || "").trim() ? v : (en[i] || ""))), isFallback: false };
        if (hasEn) return { options: en, isFallback: true };
      }
      return { options: [], isFallback: false };
    }

    function normalizeTestJson(rawInput) {
      const data = typeof rawInput === "string" ? JSON.parse(rawInput) : rawInput;
      const rawQs = Array.isArray(data) ? data : (data.questions || data.qList || data.items || data.data || []);
      if (!Array.isArray(rawQs) || rawQs.length === 0) throw new Error("No valid questions array found.");

      const questions = rawQs.map((q, idx) => {
        const rawOpts = q.options || q.choices || q.answers || ["Option A", "Option B", "Option C", "Option D"];
        let normOpts = { en: [], hi: [] };
        if (Array.isArray(rawOpts)) {
          if (rawOpts.length && typeof rawOpts[0] === "object" && rawOpts[0] !== null) {
            normOpts.en = rawOpts.map(o => o.en || o.english || "");
            normOpts.hi = rawOpts.map(o => o.hi || o.hindi || "");
          } else {
            normOpts.en = rawOpts.map(String);
            normOpts.hi = rawOpts.map(String);
          }
        } else if (typeof rawOpts === "object") {
          normOpts.en = Array.isArray(rawOpts.en) ? rawOpts.en.map(String) : [];
          normOpts.hi = Array.isArray(rawOpts.hi) ? rawOpts.hi.map(String) : [];
        }

        const normLoc = (v) => {
          if (!v) return null;
          if (typeof v === "string") return { en: v, hi: v };
          return { ...(v.en ? { en: v.en } : {}), ...(v.hi ? { hi: v.hi } : {}) };
        };

        let ans = q.correctAnswer ?? q.correct ?? q.ans ?? q.correctIndex ?? 0;
        if (typeof ans === "string") {
          const map = { A: 0, B: 1, C: 2, D: 3, E: 4 };
          const up = ans.trim().toUpperCase();
          ans = map[up] ?? (parseInt(up, 10) || 0);
        }

        return {
          id: q.id || (idx + 1),
          type: q.type || "standard",
          subjectTag: q.subjectTag || q.subject || "General",
          pyqTag: q.pyqTag || q.examTag || "CGPSC",
          image: q.image || q.img || null,
          passage: normLoc(q.passage),
          direction: normLoc(q.direction),
          assertion: normLoc(q.assertion),
          reason: normLoc(q.reason),
          question: normLoc(q.question || q.text || q.prompt) || { en: "", hi: "" },
          options: normOpts,
          correctIndex: Number(ans) || 0,
          explanation: normLoc(q.explanation || q.solution) || { en: "No explanation provided.", hi: "स्पष्टीकरण उपलब्ध नहीं है।" }
        };
      });

      return {
        title: Array.isArray(data) ? "Custom Mock Test" : (data.title || data.testName || data.name || "Mock Test"),
        durationMinutes: Math.max(1, parseInt(data.durationMinutes || data.duration || 30, 10) || 30),
        marksCorrect: parseFloat(data.positiveMarks ?? data.marksCorrect ?? 2.0) || 2.0,
        marksNegative: parseFloat(data.negativeMarks ?? data.marksNegative ?? 0.66) || 0.0,
        questions
      };
    }

    function toMillis(ts) {

    function fmtCountdown(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return d > 0 ? `${d}d ${h}h ${m}m ${sec}s` : `${pad(h)}h ${pad(m)}m ${pad(sec)}s`;
    }

    function fmtTimer(sec) {
      const s = Math.max(0, sec);

              studentName, dateOfBirth, email, mobileNumber, updatedAt: serverTimestamp()
            });
          }
          const regEntry = {
            uid, studentName, dateOfBirth, email, mobileNumber, rollNumber,
            createdAt: state.profile?.createdAt || serverTimestamp(),
            updatedAt: serverTimestamp()
          };
          try {
            await updateDoc(doc(db, "portalData", "userRegistry"), {
              [`users.${uid}`]: regEntry,
              updatedAt: serverTimestamp()
            });
          } catch (e) {
            if (e.code === "not-found") {
              await setDoc(doc(db, "portalData", "userRegistry"), {
                users: { [uid]: regEntry },
                updatedAt: serverTimestamp()
              });
            } else throw e;
          }
          closeModal();
          showBanner(`Admit Card Ready • Roll No: ${rollNumber}`);
        } catch (err) {
          alert("Registration failed: " + err.message);
        }
      };
    }

    // --- Action Gate ---
    function gateAction(action) {
      if (!state.user) { state.pendingAction = action; openSignInModal(); return; }
      if (!state.profile) { state.pendingAction = action; openRegistrationModal(false); return; }
      executeAction(action);
    }

    async function executeAction(action) {
      try {
        if (action.type === "PRACTICE") {
          const snap = await getDoc(doc(db, "practiceTests", action.testId));
          if (!snap.exists()) return showBanner("Practice test not found.");
          const d = snap.data();
          startExamPlayer({
            testId: action.testId, isScheduled: false, mode: action.mode,
            title: d.title, durationMinutes: d.durationMinutes,
            marksCorrect: d.marksCorrect, marksNegative: d.marksNegative,
            questions: d.questions || []
          });
        } else if (action.type === "SCHEDULED") {
          const s = action.summary;
          const now = Date.now();
          if (now < s.windowStartMs) return alert(`Exam opens on ${fmtDate(s.windowStartMs)}.`);
          if (now > s.windowEndMs) return openRankModal(s);
          const attemptSnap = await getDoc(doc(db, "users", state.user.uid, "attempts", s.testId));
          if (attemptSnap.exists()) {
            return alert(`Single Attempt Completed! Score: ${attemptSnap.data().totalScore}. Rank List unlocks at ${fmtDate(s.windowEndMs)}.`);
          }
          const testSnap = await getDoc(doc(db, "scheduledTests", s.testId));
          if (!testSnap.exists()) return showBanner("Scheduled test payload missing.");
          const d = testSnap.data();
          startExamPlayer({
            testId: s.testId, isScheduled: true, mode: "TEST",
            title: d.title, durationMinutes: d.durationMinutes,
            marksCorrect: d.marksCorrect, marksNegative: d.marksNegative,
            questions: d.questions || []
          });
        } else if (action.type === "CODE") {
          const q = query(collection(db, "scheduledTests"), where("testCode", "==", action.code), limit(1));
          const qs = await getDocs(q);
          if (qs.empty) return alert(`No scheduled test found for code "${action.code}".`);
          const docSnap = qs.docs[0];
          const v = docSnap.data();
          executeAction({
            type: "SCHEDULED",
            summary: { ...v, testId: docSnap.id, windowStartMs: toMillis(v.windowStartAt), windowEndMs: toMillis(v.windowEndAt) }
          });
        }
      } catch (err) {
        alert("Unable to launch exam: " + err.message);
      }
    }

    function startExamPlayer(session) {
      state.player = {

        remainingSec: session.durationMinutes * 60,
        responses: session.questions.map((_, i) => ({ selected: null, status: i === 0 ? "NOT_ANSWERED" : "NOT_VISITED" })),

        result: null

          clearInterval(timerInterval);
          submitActiveExam();
        }
      }, 1000);
    }

    function renderPlayer() {

      const rpass = resolveLocText(q.passage, p.lang);

      const paletteHtml = p.questions.map((_, i) => {
        const st = p.responses[i].status;
        const cls = st === "ANSWERED" ? "answered" : st === "NOT_ANSWERED" ? "not-answered" : st === "MARKED" ? "marked" : "";
        return `<button class="q-pill ${cls} ${i === p.idx ? "current" : ""}" data-qidx="${i}">${i + 1}</button>`;
      }).join("");

      const optsHtml = ro.options.map((optText, oIdx) => {
        const isSel = resp.selected === oIdx;
        const isCorr = oIdx === q.correctIndex;
        let cls = "";
        if (showFb && isCorr) cls = "correct";
        else if (showFb && isSel && !isCorr) cls = "wrong";
        else if (isSel) cls = "selected";
        return `
          <button class="option-btn ${cls}" ${p.submitted ? "disabled" : ""} data-opt="${oIdx}">

          <div class="card stack" style="gap:14px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">

      document.getElementById("exitPlayerBtn").onclick = () => {
        if (!p.submitted && !confirm("Leave active exam? Unsubmitted answers will be lost.")) return;
        clearInterval(timerInterval);
        state.player = null;

      document.getElementById("prevQBtn").onclick = () => { if (p.idx > 0) { p.idx--; renderPlayer(); } };

          renderPlayer();
        } else alert("Last question reached. Click Submit Test when ready.");
      };
      const subBtn = document.getElementById("submitExamBtn");
      if (subBtn) subBtn.onclick = () => { if (confirm("Submit test now?")) submitActiveExam(); };
      const resBtn = document.getElementById("viewScoreBtn");
      if (resBtn) resBtn.onclick = showPlayerScoreModal;
    }

    async function submitActiveExam() {
      const p = state.player;
      if (!p || p.submitted) return;
      clearInterval(timerInterval);
      p.submitted = true;

      let correctCount = 0, wrongCount = 0, unattemptedCount = 0;
      const selectedOptions = p.questions.map((q, i) => {
        const sel = p.responses[i].selected;
        if (sel === null || sel === undefined) { unattemptedCount++; return -1; }
        if (sel === q.correctIndex) correctCount++; else wrongCount++;
        return sel;
      });
      const raw = correctCount * p.marksCorrect;
      const neg = wrongCount * p.marksNegative;
      const totalScore = Math.max(0, raw - neg);
      const maxScore = p.questions.length * p.marksCorrect;
      const attempted = correctCount + wrongCount;
      const accuracyPercent = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;
      const timeTakenSeconds = Math.max(0, p.durationMinutes * 60 - p.remainingSec);

      p.result = { correctCount, wrongCount, unattemptedCount, totalScore, maxScore, accuracyPercent, timeTakenSeconds, neg };
      renderPlayer();
      showPlayerScoreModal();

      if (state.user && state.profile && !String(p.testId).startsWith("local_")) {
        try {
          if (p.isScheduled) {
            await updateDoc(doc(db, "testMeritSheets", p.testId), {
              [`entries.${state.user.uid}`]: {
                uid: state.user.uid, studentName: state.profile.studentName, rollNumber: state.profile.rollNumber,
                totalScore, maxScore, correctCount, wrongCount, unattemptedCount,
                accuracyPercent, timeTakenSeconds, appSwitchWarnings: p.warnings, submittedAt: serverTimestamp()
              },
              updatedAt: serverTimestamp()
            });
          }
          const attemptId = p.isScheduled ? p.testId : `${p.testId}_${Date.now()}`;
          await setDoc(doc(db, "users", state.user.uid, "attempts", attemptId), {
            userId: state.user.uid, testId: p.testId, testTitle: p.title, mode: p.mode,
            rollNumber: state.profile.rollNumber, studentName: state.profile.studentName,
            correctCount, wrongCount, unattemptedCount, totalScore, maxScore,
            accuracyPercent, timeTakenSeconds, appSwitchWarnings: p.warnings,
            selectedOptions, submittedAt: serverTimestamp()
          });
          showBanner(p.isScheduled ? "Score recorded in Official Merit Sheet!" : "Attempt saved to My Results!");
        } catch (err) {
          alert("Score sync warning: " + err.message);
        }
      }
    }

            ${socialsHtml}
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <input id="newSocApp" placeholder="App Name (e.g. Telegram)" style="flex:1;" />
              <input id="newSocUrl" placeholder="https://t.me/..." style="flex:1.5;" />
              <button class="btn btn-outline" id="addSocBtn">+ Add Handle</button>
            </div>
            <button class="btn btn-emerald" id="saveBrandBtn">Publish Branding &amp; Footer Live</button>
          </div>
        `;
      } else if (state.adminSubTab === "CMS") {
        const listHtml = state.config.blocks.map((b, i) => `
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <div><span class="badge badge-blue">${esc(b.type)}</span> <strong>${esc(b.title || "(Untitled)")}</strong> ${b.visible === false ? "(Hidden)" : ""}</div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-outline" data-blk-up="${i}">&uarr;</button>
              <button class="btn btn-outline" data-blk-dn="${i}">&darr;</button>
              <button class="btn btn-outline" data-blk-vis="${i}">${b.visible === false ? "Show" : "Hide"}</button>
              <button class="btn btn-rose" data-blk-del="${i}">Delete</button>
            </div>
          </div>
        `).join("");
        bodyHtml = `
          <div class="card stack">
            <h3>Add Dashboard Article / Drive Image / Drive Video</h3>
            <select id="blkType">
              <option value="TEXT_ARTICLE">Text Article / Notice</option>
              <option value="HERO_BANNER">Hero Announcement Banner</option>
              <option value="DRIVE_IMAGE">Google Drive Image Card</option>
              <option value="DRIVE_VIDEO">Google Drive Video Card</option>
            </select>
            <input id="blkBadge" placeholder="Badge (e.g. NOTICE / NEW)" />
            <input id="blkTitle" placeholder="Headline / Title" />
            <textarea id="blkBody" rows="3" placeholder="Article text or caption..."></textarea>
            <input id="blkUrl" placeholder="Google Drive Image/Video Link (optional for articles)" />
            <button class="btn btn-navy" id="addBlkBtn">+ Add &amp; Publish Block Live</button>
          </div>
          <div class="stack">${listHtml}</div>
        `;
      } else if (state.adminSubTab === "LIBRARY") {
        const pracList = state.catalog.practice.map(p => `
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
            <div><strong>${esc(p.title)}</strong> <div style="font-size:12px;color:var(--slate-500);">${esc(p.subjectTag)} • ${p.questionCount} Qs • ${p.durationMinutes}m</div></div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-outline" data-edit-prac="${esc(p.testId)}">Edit</button>
              <button class="btn btn-rose" data-del-prac="${esc(p.testId)}">Delete</button>
            </div>
          </div>
        `).join("");
        bodyHtml = `
          <div class="card stack">
            <h3>${state.editingPracticeId ? "Edit Practice Test" : "Upload Practice / Quiz Test"}</h3>
            <input id="pracTitle" placeholder="Test Title" />
            <input id="pracSubj" value="CGPSC General Studies" placeholder="Subject Tag" />
            <div style="display:flex;gap:8px;">
              <input id="pracDur" value="30" placeholder="Minutes" />
              <input id="pracPos" value="2.0" placeholder="+Marks" />
              <input id="pracNeg" value="0.66" placeholder="-Marks" />
            </div>
            <input type="file" id="pracFilePick" accept=".json,.txt" />
            <textarea id="pracJson" rows="5" placeholder="Paste test JSON..."></textarea>
            <div style="display:flex;gap:8px;">
              ${state.editingPracticeId ? `<button class="btn btn-outline" id="cancelPracEditBtn">Cancel Edit</button>` : ""}
              <button class="btn btn-primary" style="flex:1;" id="savePracBtn">${state.editingPracticeId ? "Update Practice Test" : "Publish to Practice Library"}</button>
            </div>
          </div>
          <div class="stack">${pracList}</div>
        `;
      } else {
        const nowIso = (ms) => new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        const schedRows = state.catalog.scheduled.map(s => `
          <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div><strong>${esc(s.title)}</strong> <span class="mono" style="color:var(--royal-600);">(${esc(s.testCode)})</span><div style="font-size:12px;color:var(--slate-500);">${fmtDate(s.windowStartMs)} &rarr; ${fmtDate(s.windowEndMs)}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-primary" data-adm-rank="${esc(s.testId)}">Rank List &amp; PDF</button>
              <button class="btn btn-rose" data-adm-del-sched="${esc(s.testId)}">Delete</button>
            </div>
          </div>
        `).join("");
        const usersRows = state.adminUsers.map(u => `
          <tr><td><strong>${esc(u.studentName)}</strong></td><td class="mono">${esc(u.rollNumber)}</td><td>${esc(u.dateOfBirth)}</td><td>${esc(u.mobileNumber)}</td><td>${esc(u.email)}</td></tr>
        `).join("");
        bodyHtml = `
          <div class="card stack">
            <h3>Schedule Fixed-Window Exam</h3>
            <input id="scTitle" placeholder="Exam Title" />
            <div style="display:flex;gap:8px;">
              <input id="scDur" value="60" placeholder="Minutes" />
              <input id="scPos" value="2.0" placeholder="+Marks" />
              <input id="scNeg" value="0.66" placeholder="-Marks" />
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <label style="flex:1;font-size:12px;">Window Start<input type="datetime-local" id="scStart" value="${nowIso(Date.now())}" /></label>
              <label style="flex:1;font-size:12px;">Window End<input type="datetime-local" id="scEnd" value="${nowIso(Date.now() + 3 * 3600000)}" /></label>
            </div>
            <input type="file" id="scFilePick" accept=".json,.txt" />
            <textarea id="scJson" rows="4" placeholder="Paste scheduled exam JSON..."></textarea>
            <button class="btn btn-navy" id="pubSchedBtn">Publish Scheduled Exam &amp; Merit Sheet</button>
          </div>
          <h3>Scheduled Exams</h3>
          <div class="stack">${schedRows}</div>
          <div class="card stack">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h3 style="margin:0;">Consolidated Student Directory (1 Read)</h3>
              <button class="btn btn-outline" id="syncUsersBtn">Load Directory</button>
            </div>
            ${state.adminUsers.length ? `<table><thead><tr><th>Name</th><th>Roll No</th><th>DOB</th><th>Mobile</th><th>Email</th></tr></thead><tbody>${usersRows}</tbody></table>` : `<p style="font-size:13px;color:var(--slate-500);">Click Load Directory to inspect all registered students in 1 Firestore read.</p>`}
          </div>
        `;
      }

      el.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;">${subBtns}</div>${bodyHtml}`;
      el.querySelectorAll("[data-asub]").forEach(b => b.onclick = () => { state.adminSubTab = b.getAttribute("data-asub"); renderAdminTab(); });

      // Wire Admin events per active subTab
      if (state.adminSubTab === "BRANDING") {
        el.querySelectorAll("[data-del-soc]").forEach(b => b.onclick = () => {
          state.config.socialLinks.splice(Number(b.getAttribute("data-del-soc")), 1);
          renderAdminTab();
        });
        document.getElementById("addSocBtn").onclick = () => {
          const appName = document.getElementById("newSocApp").value.trim();
          const url = document.getElementById("newSocUrl").value.trim();
          if (appName && url) {
            state.config.socialLinks.push({ id: `soc_${Date.now()}`, appName, url, orderIndex: state.config.socialLinks.length });
            renderAdminTab();
          }
        };
        document.getElementById("saveBrandBtn").onclick = async () => {
          state.config.portalTitle = document.getElementById("admTitle").value.trim() || "Crack CGPSC Free Test Series";
          state.config.instituteName = document.getElementById("admInst").value.trim() || "Crack CGPSC Academy";
          state.config.logoDriveUrl = document.getElementById("admLogo").value.trim();
          state.config.resolvedLogoUrl = toDriveImage(state.config.logoDriveUrl);
          await saveConfigToFirestore();
        };
      } else if (state.adminSubTab === "CMS") {
        document.getElementById("addBlkBtn").onclick = async () => {
          const type = document.getElementById("blkType").value;
          const driveUrl = document.getElementById("blkUrl").value.trim();
          state.config.blocks.push({
            id: `blk_${Date.now()}`, type,
            badgeText: document.getElementById("blkBadge").value.trim(),
            title: document.getElementById("blkTitle").value.trim(),
            body: document.getElementById("blkBody").value.trim(),
            driveUrl,
            resolvedMediaUrl: type === "DRIVE_VIDEO" ? toVideoPreview(driveUrl) : toDriveImage(driveUrl),
            visible: true, orderIndex: state.config.blocks.length
          });
          await saveConfigToFirestore();
          renderAdminTab();
        };
        el.querySelectorAll("[data-blk-up]").forEach(b => b.onclick = async () => {
          const i = Number(b.getAttribute("data-blk-up"));
          if (i > 0) { [state.config.blocks[i - 1], state.config.blocks[i]] = [state.config.blocks[i], state.config.blocks[i - 1]]; await saveConfigToFirestore(); renderAdminTab(); }
        });
        el.querySelectorAll("[data-blk-dn]").forEach(b => b.onclick = async () => {
          const i = Number(b.getAttribute("data-blk-dn"));
          if (i < state.config.blocks.length - 1) { [state.config.blocks[i + 1], state.config.blocks[i]] = [state.config.blocks[i], state.config.blocks[i + 1]]; await saveConfigToFirestore(); renderAdminTab(); }
        });
        el.querySelectorAll("[data-blk-vis]").forEach(b => b.onclick = async () => {
          const i = Number(b.getAttribute("data-blk-vis"));
          state.config.blocks[i].visible = state.config.blocks[i].visible === false;
          await saveConfigToFirestore(); renderAdminTab();
        });
        el.querySelectorAll("[data-blk-del]").forEach(b => b.onclick = async () => {
          state.config.blocks.splice(Number(b.getAttribute("data-blk-del")), 1);
          await saveConfigToFirestore(); renderAdminTab();
        });
      } else if (state.adminSubTab === "LIBRARY") {
        document.getElementById("pracFilePick").onchange = (e) => {
          const f = e.target.files[0]; if (!f) return;
          const r = new FileReader(); r.onload = () => { document.getElementById("pracJson").value = r.result; }; r.readAsText(f);
        };
        const cancelBtn = document.getElementById("cancelPracEditBtn");
        if (cancelBtn) cancelBtn.onclick = () => {
          state.editingPracticeId = null;
          state.editingPracticeCreatedAt = null;
          renderAdminTab();
        };
        document.getElementById("savePracBtn").onclick = async () => {
          try {
            const parsed = normalizeTestJson(document.getElementById("pracJson").value);
            const isEdit = Boolean(state.editingPracticeId);
            const testId = state.editingPracticeId || `prac_${Date.now()}`;
            const title = document.getElementById("pracTitle").value.trim() || parsed.title;
            const subjectTag = document.getElementById("pracSubj").value.trim() || "General Studies";
            const durationMinutes = parseInt(document.getElementById("pracDur").value, 10) || parsed.durationMinutes;
            const marksCorrect = parseFloat(document.getElementById("pracPos").value) || parsed.marksCorrect;
            const marksNegative = parseFloat(document.getElementById("pracNeg").value) || 0;
            const createdAtVal = (isEdit && state.editingPracticeCreatedAt) ? state.editingPracticeCreatedAt : serverTimestamp();
            await setDoc(doc(db, "practiceTests", testId), {
              adminUid: state.user.uid, title, subjectTag, durationMinutes, marksCorrect, marksNegative,
              questionCount: parsed.questions.length, questions: parsed.questions,
              createdAt: createdAtVal, updatedAt: serverTimestamp()
            });
            await upsertCatalog("practice", testId, {
              testId, title, subjectTag, durationMinutes, marksCorrect, marksNegative,
              questionCount: parsed.questions.length, updatedAt: serverTimestamp()
            });
            state.editingPracticeId = null;
            state.editingPracticeCreatedAt = null;
            showBanner(`${isEdit ? "Updated" : "Published"} practice test "${title}"!`);
          } catch (err) { alert("Error: " + err.message); }
        };
        el.querySelectorAll("[data-edit-prac]").forEach(b => b.onclick = async () => {
          const p = state.catalog.practice.find(x => x.testId === b.getAttribute("data-edit-prac"));
          if (!p) return;
          state.editingPracticeId = p.testId;
          state.editingPracticeCreatedAt = null;
          renderAdminTab();
          document.getElementById("pracTitle").value = p.title;
          document.getElementById("pracSubj").value = p.subjectTag;
          document.getElementById("pracDur").value = p.durationMinutes;
          document.getElementById("pracPos").value = p.marksCorrect;
          document.getElementById("pracNeg").value = p.marksNegative;
          try {
            const snap = await getDoc(doc(db, "practiceTests", p.testId));
            if (snap.exists()) {
              const d = snap.data();
              state.editingPracticeCreatedAt = d.createdAt || null;
              document.getElementById("pracJson").value = JSON.stringify({
                title: d.title,
                durationMinutes: d.durationMinutes,
                positiveMarks: d.marksCorrect,
                negativeMarks: d.marksNegative,
                questions: d.questions || []
              }, null, 2);
            }
          } catch (err) {
            alert("Loaded metadata; paste updated JSON if needed: " + err.message);
          }
        });
        el.querySelectorAll("[data-del-prac]").forEach(b => b.onclick = async () => {
          const id = b.getAttribute("data-del-prac");
          if (!confirm("Delete this practice test?")) return;
          await deleteDoc(doc(db, "practiceTests", id));
          await updateDoc(doc(db, "portalData", "testCatalog"), { [`practice.${id}`]: deleteField(), updatedAt: serverTimestamp() });
        });
      } else {
        document.getElementById("scFilePick").onchange = (e) => {
          const f = e.target.files[0]; if (!f) return;
          const r = new FileReader(); r.onload = () => { document.getElementById("scJson").value = r.result; }; r.readAsText(f);
        };
        document.getElementById("pubSchedBtn").onclick = async () => {
          try {
            const parsed = normalizeTestJson(document.getElementById("scJson").value);
            const testId = `sched_${Date.now()}`;
            const testCode = "CG" + Math.random().toString(36).substring(2, 6).toUpperCase();
            const title = document.getElementById("scTitle").value.trim() || parsed.title;
            const durationMinutes = parseInt(document.getElementById("scDur").value, 10) || parsed.durationMinutes;
            const marksCorrect = parseFloat(document.getElementById("scPos").value) || parsed.marksCorrect;
            const marksNegative = parseFloat(document.getElementById("scNeg").value) || 0;
            const startTs = Timestamp.fromDate(new Date(document.getElementById("scStart").value));
            const endTs = Timestamp.fromDate(new Date(document.getElementById("scEnd").value));
            if (endTs.toMillis() <= startTs.toMillis()) return alert("End date/time must be after start.");
            await setDoc(doc(db, "scheduledTests", testId), {
              adminUid: state.user.uid, testCode, title, instituteName: state.config.instituteName,
              durationMinutes, marksCorrect, marksNegative, questionCount: parsed.questions.length,
              windowStartAt: startTs, windowEndAt: endTs, questions: parsed.questions,
              createdAt: serverTimestamp(), updatedAt: serverTimestamp()
            });
            await setDoc(doc(db, "testMeritSheets", testId), {
              testId, windowStartAt: startTs, windowEndAt: endTs, entries: {}, updatedAt: serverTimestamp()
            });
            await upsertCatalog("scheduled", testId, {
              testId, testCode, title, instituteName: state.config.instituteName,
              durationMinutes, marksCorrect, marksNegative, questionCount: parsed.questions.length,
              windowStartAt: startTs, windowEndAt: endTs
            });
            showBanner(`Scheduled "${title}" • Code: ${testCode}`);
          } catch (err) { alert("Error: " + err.message); }
        };
        el.querySelectorAll("[data-adm-rank]").forEach(b => b.onclick = () => {
          const s = state.catalog.scheduled.find(x => x.testId === b.getAttribute("data-adm-rank"));
          if (s) openRankModal(s);
        });
        el.querySelectorAll("[data-adm-del-sched]").forEach(b => b.onclick = async () => {
          const id = b.getAttribute("data-adm-del-sched");
          if (!confirm("Delete scheduled exam?")) return;
          await deleteDoc(doc(db, "scheduledTests", id));
          await deleteDoc(doc(db, "testMeritSheets", id));
          await updateDoc(doc(db, "portalData", "testCatalog"), { [`scheduled.${id}`]: deleteField(), updatedAt: serverTimestamp() });
        });
        document.getElementById("syncUsersBtn").onclick = async () => {
          const snap = await getDoc(doc(db, "portalData", "userRegistry"));
          state.adminUsers = snap.exists() ? Object.values(snap.data().users || {}) : [];
          renderAdminTab();
        };
      }
    }

    async function saveConfigToFirestore() {
      state.config.blocks.forEach((b, i) => b.orderIndex = i);
      state.config.socialLinks.forEach((s, i) => s.orderIndex = i);
      await setDoc(doc(db, "portalData", "dashboardConfig"), {
        portalTitle: state.config.portalTitle,
        instituteName: state.config.instituteName,
        logoDriveUrl: state.config.logoDriveUrl,
        resolvedLogoUrl: state.config.resolvedLogoUrl,
        blocks: state.config.blocks,
        socialLinks: state.config.socialLinks,
        updatedAt: serverTimestamp()
      });
      showBanner("Portal Branding & CMS saved live!");
    }

    async function upsertCatalog(bucket, testId, obj) {
      try {
        await updateDoc(doc(db, "portalData", "testCatalog"), {
          [`${bucket}.${testId}`]: obj,
          updatedAt: serverTimestamp()
        });
      } catch (e) {
        if (e.code === "not-found") {
          await setDoc(doc(db, "portalData", "testCatalog"), {
            scheduled: bucket === "scheduled" ? { [testId]: obj } : {},
            practice: bucket === "practice" ? { [testId]: obj } : {},
            updatedAt: serverTimestamp()
          });
        } else throw e;
      }
    }

    renderHeader();
    renderPortalTabs();
  </script>
</body>
</html>
